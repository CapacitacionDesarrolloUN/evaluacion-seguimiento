@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --rojo:#B82D35; --bg:#141212; --surface:#1E1B1B; --line:#332E2D; --fg:#F2EEEC; --muted:#A89F9C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --curso-bg:#13293B; --curso-ink:#A9D6FA; --sin-bg:#3A1D12; --sin-ink:#F7BFA8; --ok-bg:#0F2E24; --ok-ink:#A6E6CB;
  --track:#0d366b; --grid:#2c2c2a; --axis:#383835; --focus:#FFCD00; --err:#F4B4B4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --rojo:#B82D35; --bg:#141212; --surface:#1E1B1B; --line:#332E2D; --fg:#F2EEEC; --muted:#A89F9C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --curso-bg:#13293B; --curso-ink:#A9D6FA; --sin-bg:#3A1D12; --sin-ink:#F7BFA8; --ok-bg:#0F2E24; --ok-ink:#A6E6CB;
  --track:#0d366b; --grid:#2c2c2a; --axis:#383835; --focus:#FFCD00; --err:#F4B4B4;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--roble);color:var(--negro);padding:8px 14px;border-radius:6px;font-weight:600;z-index:50}
.skip:focus{left:12px}

/* Encabezado */
.top{background:var(--rojo);color:#fff}
.top-in{display:flex;align-items:center;gap:14px 22px;padding:18px 0;flex-wrap:wrap}
.logo{width:150px;aspect-ratio:331/92;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.ttl{flex:1 1 300px;min-width:0;border-left:1px solid rgba(255,255,255,.4);padding-left:22px}
h1{margin:0;font:400 clamp(24px,3.4vw,34px)/1.05 var(--f-title);letter-spacing:-.005em}
.ttl p{margin:5px 0 0;color:rgba(255,255,255,.88);font-size:15px}
.acts{display:flex;gap:10px;align-items:center}
.rule{height:6px;background:var(--roble)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:8px;border:1.5px solid transparent;font-weight:600;font-size:15px;line-height:1.1;cursor:pointer;background:none;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.amarillo{background:var(--roble);color:var(--negro)}
.btn.amarillo:hover{background:#ffd93d}
.btn.ghost{color:#fff;border-color:rgba(255,255,255,.5);padding:10px}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.line:hover{border-color:var(--fg)}
.btn.rojo{background:var(--rojo);color:#fff}
.btn.rojo:hover{background:var(--rojo-hondo)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top :focus-visible{outline-color:#fff}

/* Franja de estado */
.estado{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 28px;padding:14px 0;color:var(--muted);font-size:14.5px;border-bottom:1px solid var(--line)}
.estado b{color:var(--fg);font-weight:600}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--roble);color:var(--negro);font-weight:700;font-size:13px;margin-right:6px}

/* Resumen */
.resumen{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,.8fr);margin-top:30px}
.resumen>section{padding:2px 34px}
.resumen>section:first-child{padding-left:0}
.resumen>section:last-child{padding-right:0}
.resumen>section+section{border-left:1px solid var(--line)}
.resumen h2,.col h2{margin:0 0 12px;font:600 15px/1.3 var(--f-body);color:var(--muted);letter-spacing:.005em}
.hero{font:700 clamp(76px,9.5vw,116px)/.88 var(--f-body);letter-spacing:-.035em;margin:2px 0 6px}
.hero small{font-size:.38em;font-weight:600;letter-spacing:0;margin-left:3px;color:var(--muted)}
.sub-hero{margin:0 0 16px;font-size:17px}
.meter{height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.meter>i{display:block;height:100%;width:var(--w,0%);background:var(--s1);border-radius:7px;animation:llenar .7s cubic-bezier(.22,.8,.24,1) both}
@keyframes llenar{from{width:0}}
.meter-pie{display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.meter-pie b{color:var(--fg);font-weight:600}
.num-medio{font:700 clamp(44px,5vw,60px)/1 var(--f-body);letter-spacing:-.02em}
.num-medio small{font-size:.38em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.nota{margin:10px 0 0;color:var(--muted);font-size:14px}
.nota.dato{margin-top:12px}

/* Jefes por estado */
.pila{display:flex;gap:2px;height:20px;margin:6px 0 14px}
.pila button{border:0;padding:0;min-width:3px;background:var(--c);cursor:pointer;border-radius:4px;flex:var(--n) 1 0%;transition:filter .12s}
.pila button:hover,.pila button:focus-visible{filter:brightness(1.12) saturate(1.1)}
.pila button[data-n="0"]{display:none}
.leyenda{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.leyenda button{width:100%;display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:5px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;color:var(--fg)}
.leyenda button:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.leyenda i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.leyenda .n{font-weight:700;font-variant-numeric:tabular-nums}
.leyenda .p{color:var(--muted);font-size:14px;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}

/* Cuerpo */
.cuerpo{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:44px;margin:44px 0 20px;align-items:start}
.col h2.grande{font:700 22px/1.2 var(--f-body);color:var(--fg);margin:0 0 4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.herram{padding:16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:baseline}
.tab span{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.tab[aria-pressed="true"] span{color:inherit;opacity:.8}
.fila-h{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.buscar{flex:1 1 220px;position:relative}
.buscar input{width:100%;padding:10px 12px 10px 38px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.buscar input:focus-visible{outline-offset:0}
.buscar svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
select{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.conteo .acc{display:flex;gap:18px}
.lnk[disabled]{opacity:.4;cursor:not-allowed}
.conteo{padding:10px 16px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.lista{list-style:none;margin:0;padding:0}
.lista>li+li{border-top:1px solid var(--line)}
.jefe summary{list-style:none;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 16px;cursor:pointer}
.jefe summary::-webkit-details-marker{display:none}
.jefe summary:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}

<script>
(function(){

/* ==========================================================================

const sinTildes = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');

  if (!b) return '0';

  for (const ch of primera){ if (ch === '"') q = !q; else if (!q && ch in cuenta) cuenta[ch]++; }
  const delim = Object.entries(cuenta).sort((a, b) => b[1] - a[1])[0][0];
  const filas = []; let fila = [], cel = '', dentro = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (dentro){
      if (c === '"'){ if (texto[i + 1] === '"'){ cel += '"'; i++; } else dentro = false; }
      else cel += c;

    else if (c === delim){ fila.push(cel); cel = ''; }
    else if (c === '\n' || c === '\r'){

      fila = [];

const decodeSP = s => String(s).replace(/^OData/, '').replace(/_x([0-9a-fA-F]{4})_/g, (m, x) => String.fromCharCode(parseInt(x, 16)));
const claveCol = s => sinTildes(decodeSP(s)).toLowerCase().replace(/[^a-z0-9]/g, '');

  let hi = filas.findIndex(f => { const k = f.map(claveCol); return k.includes('jefe') && k.includes('subordinado'); });

async function tablasDeArchivo(archivo){
  if (/\.xlsx?$/i.test(archivo.name)){
    const X = await cargarXLSX();

  }

/* ==========================================================================
   Modelo: cruza Relaciones con Respuestas
   ========================================================================== */
function calcular(rel, res){
  const jefes = new Map(), pares = new Map(); let relRepetidas = 0;
  for (const r of rel){
    const kj = norm(r.jefe), ks = norm(r.sub); if (!kj || !ks) continue;
    const k = kj + '|' + ks;
    if (pares.has(k)){ relRepetidas++; continue; }
    let j = jefes.get(kj);
    if (!j){ j = { key: kj, nombre: bonito(r.jefe), nk: kj, items: [] }; jefes.set(kj, j); }
    const it = { jefe: j, sub: bonito(r.sub), ks, cargo: bonitoCargo(r.cargo), resp: null };
    pares.set(k, it); j.items.push(it);
  }
  const huerfanas = []; let repetidas = 0;
  for (const r of [...res].sort((a, b) => (a.ts ?? 0) - (b.ts ?? 0))){
    const it = pares.get(norm(r.jefe) + '|' + norm(r.sub));
    if (!it){ huerfanas.push(r); continue; }
    if (it.resp) repetidas++;
    it.resp = r;                                               // si hay repetidas, vale la última
  }
  const lista = [...jefes.values()];
  let total = 0, hechas = 0;
  for (const j of lista){
    j.total = j.items.length; j.hechas = j.items.filter(i => i.resp).length;
    j.estado = j.hechas === 0 ? 'sin' : (j.hechas === j.total ? 'ok' : 'curso');
    j.pend = j.total - j.hechas; j.pct = pctNum(j.hechas, j.total);
    total += j.total; hechas += j.hechas;
    j.items.sort((a, b) => (a.resp ? 1 : 0) - (b.resp ? 1 : 0) || a.sub.localeCompare(b.sub, 'es'));
  }
  const unicas = [...pares.values()].filter(i => i.resp).map(i => i.resp);
  const porEstado = { sin: 0, curso: 0, ok: 0 }; lista.forEach(j => porEstado[j.estado]++);
  const proms = unicas.map(r => r.prom).filter(v => v != null);
  const porPregunta = {}; let maxVisto = 0;
  for (const p of PREGUNTAS){
    const vs = unicas.map(r => r.q[p]).filter(v => v != null);
    porPregunta[p] = { media: mediaDe(vs), n: vs.length }; vs.forEach(v => { if (v > maxVisto) maxVisto = v; });
  }
  const bloques = CONFIG.bloques.map(b => {
    const vs = unicas.flatMap(r => b.preguntas.map(p => r.q[p]).filter(v => v != null));
    return { ...b, media: mediaDe(vs), n: vs.length };
  });
  const dias = new Map(); let ultimo = null;
  for (const r of unicas){ if (r.dia) dias.set(r.dia, (dias.get(r.dia) || 0) + 1); if (r.ts != null && (ultimo == null || r.ts > ultimo)) ultimo = r.ts; }
  return { jefes: lista, total, hechas, porEstado, promedio: mediaDe(proms), nProm: proms.length, porPregunta, bloques,
           escala: Math.max(CONFIG.escalaMax, Math.ceil(maxVisto)), dias, ultimo, huerfanas, repetidas, relRepetidas };
}

const S = { rel: null, res: null, ejemplo: false, datos: null, cargadoEn: null,

function recalcular(){
  if (!S.rel){ S.datos = null; return; }
  S.datos = calcular(S.rel, S.res || []);
  S.cargadoEn = new Date();
}
function aplicarTablas(tablas){
  let rel = null, res = null;
  for (const filas of tablas){
    const objs = filasAObjetos(filas); if (!objs) continue;
    const cab = filas.find(f => { const k = f.map(claveCol); return k.includes('jefe') && k.includes('subordinado'); }).map(claveCol);
    if (esRespuestas(cab)){ const r = normRespuestas(objs); res = (res || []).concat(r.filas); S.descartadas = r.descartadas; }
    else rel = (rel || []).concat(normRelaciones(objs));
  }
  return { rel, res };
}
async function cargarArchivos(archivos){
  const msg = $('.aviso-c', ctxCargador());
  try{
    const todas = []; for (const a of archivos) todas.push(...await tablasDeArchivo(a));

    if (!rel && !res && !S.rel) throw new Error('No encontré las columnas Jefe y Subordinado. ¿Subiste las listas Relaciones y Respuestas?');

    if (res) S.res = res;

  }
}
function cargarDesdeSP(relItems, resItems){
  S.rel = normRelaciones(objetosSP(relItems));

/* ==========================================================================
   Datos de ejemplo (ficticios) para ver cómo se ve el tablero
   ========================================================================== */
function datosEjemplo(){
  let semilla = 20261109;
  const rnd = () => { semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const el = a => a[Math.floor(rnd() * a.length)];
  const nombres = ['MARCELA','JORGE','LUCIA','ANDRES','PAOLA','CARLOS','DIANA','SERGIO','CLAUDIA','FELIPE','NATALIA','RICARDO','MONICA','IVAN','TATIANA','HERNAN','ALEJANDRA','OSCAR','VIVIANA','MAURICIO','KAREN','DANIEL','LILIANA','EDGAR','ROSA','NELSON','ANGELA','FABIAN','MARITZA','JAIME'];
  const apellidos = ['ROMERO','CASTRO','OSPINO','BLANCO','MENDOZA','VARGAS','PACHECO','SIERRA','NAVARRO','ORTEGA','PALACIO','GUERRERO','BARRIOS','MOLINA','CORREA','ARIAS','TORRES','CABRERA','LOPEZ','DE LA HOZ','POLO','MEJIA','BERDUGO','CHARRIS','OROZCO','VISBAL','ACOSTA','REYES','SALCEDO','PEREZ'];
  const cargos = ['SECRETARIA/O','SECRETARIA/O','AUXILIAR ADMINISTRATIVO','AUXILIAR DE LABORATORIO','AUXILIAR DE BIBLIOTECA','AUXILIAR DE ADQUISICIONES'];
  const usados = new Set(); const nuevo = f => { let n; do { n = f(); } while (usados.has(n)); usados.add(n); return n; };
  const tamanos = [...Array(18).fill(1), ...Array(8).fill(2), 3, 3, 3, 4, 4, 5, 5, 6, 7, 9, 12, 16, 22];
  const rel = [], res = []; const hoy = hoyBogota();
  const ahora = { h: +new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.zona, hour: '2-digit', hourCycle: 'h23' }).format(new Date()) };
  tamanos.forEach(n => {
    const jefe = nuevo(() => `${el(nombres)} ${el(apellidos)} ${el(apellidos)}`);
    const perfil = rnd(); const frac = perfil < .3 ? 0 : perfil < .7 ? .2 + rnd() * .6 : 1;
    for (let i = 0; i < n; i++){
      const sub = nuevo(() => `${el(apellidos)} ${el(apellidos)} ${el(nombres)} ${el(nombres)}`); const cargo = el(cargos);
      rel.push({ jefe, sub, cargo });
      if (rnd() < frac){
        const q = {}; PREGUNTAS.forEach(p => { q[p] = rnd() < .08 ? 3 : rnd() < .5 ? 4 : 5; });
        const vals = Object.values(q); const dia = sumaDias(hoy, -Math.floor(rnd() * rnd() * 12));
        const tope = dia === hoy ? Math.max(8, ahora.h - 1) : 17;
        const hh = String(8 + Math.floor(rnd() * (tope - 8 + 1))).padStart(2, '0'), mm = String(Math.floor(rnd() * 60)).padStart(2, '0');
        const f = parseFecha(`${dia} ${hh}:${mm}:00`);
        res.push({ jefe, sub, cargo, q, prom: mediaDe(vals), ts: f.ts, dia });
      }
    }
  });
  const fp = parseFecha(`${hoy} ${String(Math.max(8, ahora.h - 1)).padStart(2, '0')}:05:00`);
  res.push({ jefe: 'PRUEBA MIGRACION (BORRAR)', sub: 'PRUEBA SUBORDINADO', cargo: 'SECRETARIA/O', q: { G1: 4 }, prom: 4, ts: fp.ts, dia: hoy });
  if (res.length > 3) res.push({ ...res[1], ts: res[1].ts + 3600e3 });
  return { rel, res };
}

/* ---------- Lista de jefes ---------- */
function filtrar(D){
  const q = norm(S.q);
  let l = D.jefes.filter(j => {
    if (S.filtro === 'faltan' && j.estado === 'ok') return false;
    if (S.filtro === 'sin' && j.estado !== 'sin') return false;
    if (S.filtro === 'curso' && j.estado !== 'curso') return false;
    if (S.filtro === 'ok' && j.estado !== 'ok') return false;
    if (q){ const porNombre = j.nk.includes(q); const porSub = j.items.some(i => i.ks.includes(q)); j._viaSub = !porNombre && porSub; return porNombre || porSub; }
    j._viaSub = false; return true;
  });
  const cmp = {
    pendientes: (a, b) => b.pend - a.pend || a.nombre.localeCompare(b.nombre, 'es'),
    menor: (a, b) => a.pct - b.pct || b.pend - a.pend || a.nombre.localeCompare(b.nombre, 'es'),
    mayor: (a, b) => b.pct - a.pct || a.nombre.localeCompare(b.nombre, 'es'),
    nombre: (a, b) => a.nombre.localeCompare(b.nombre, 'es')
  }[S.orden];
  return l.sort(cmp);
}

function cuerpo(D){
  const tabs = h('div', { class: 'tabs', role: 'group', 'aria-label': 'Filtrar jefes por estado', id: 'tabs' });
  const buscar = h('label', { class: 'buscar' }, h('span', { class: 'sr', text: 'Buscar un jefe o un subordinado' }),
    h('input', { type: 'search', id: 'q', placeholder: 'Buscar jefe o subordinado', autocomplete: 'off', value: S.q }));
  const sel = h('select', { id: 'orden', 'aria-label': 'Ordenar' },
    ...[['pendientes', 'Más pendientes primero'], ['menor', 'Menor avance primero'], ['mayor', 'Mayor avance primero'], ['nombre', 'Nombre (A–Z)']]
      .map(([v, t]) => h('option', { value: v, text: t, selected: S.orden === v })));
  buscar.insertBefore(icono('buscar'), buscar.firstChild.nextSibling);
  let deb; buscar.querySelector('input').addEventListener('input', e => { clearTimeout(deb); deb = setTimeout(() => { S.q = e.target.value; S.mostrar = 50; pintarLista(); }, 120); });
  sel.addEventListener('change', () => { S.orden = sel.value; S.mostrar = 50; pintarLista(); });

  const izq = h('div', { class: 'col' },
    h('h2', { class: 'grande', id: 'lista', tabindex: '-1', text: 'Avance por jefe' }),
    h('p', { class: 'nota', style: 'margin:0 0 14px', text: 'Abre un jefe para ver a quién le falta evaluar. El porcentaje junto al nombre es lo ya respondido de su equipo.' }),
    h('div', { class: 'panel' },
      h('div', { class: 'herram' }, tabs, h('div', { class: 'fila-h' }, buscar, sel)),
      h('div', { class: 'conteo', id: 'conteo', 'aria-live': 'polite' }),
      h('ul', { class: 'lista', id: 'ul' })));

  const der = h('div', { class: 'col' }, bloquePreguntas(D), bloqueDias(D));
  return h('div', { class: 'cuerpo' }, izq, der);
}

function pintarLista(){
  const D = S.datos; if (!D || !$('#ul')) return;
  const cuentas = { faltan: D.porEstado.sin + D.porEstado.curso, sin: D.porEstado.sin, curso: D.porEstado.curso, ok: D.porEstado.ok, todos: D.jefes.length };
  const tabs = $('#tabs'); tabs.replaceChildren(...[['faltan', 'Faltan por responder'], ['sin', 'Sin iniciar'], ['curso', 'En curso'], ['ok', 'Completos'], ['todos', 'Todos']].map(([k, t]) =>
    h('button', { class: 'tab', type: 'button', 'aria-pressed': String(S.filtro === k), onclick: () => { S.filtro = k; S.mostrar = 50; pintarLista(); } }, t, h('span', { text: nf0.format(cuentas[k]) }))));
  const lista = filtrar(D);
  const ul = $('#ul'); ul.replaceChildren();
  const pend = lista.reduce((a, j) => a + j.pend, 0);
  $('#conteo').replaceChildren(h('span', { text: `Mostrando ${nf0.format(lista.length)} de ${nf0.format(D.jefes.length)} jefes · ${nf0.format(pend)} cuestionarios pendientes` }),
    h('span', { class: 'acc' }, h('button', { class: 'lnk', type: 'button', disabled: !lista.length, onclick: copiarNombres, text: 'Copiar nombres' }), h('button', { class: 'lnk', type: 'button', disabled: !lista.length, onclick: descargarCSV, text: 'Descargar CSV' })));
  if (!lista.length){
    ul.append(h('li', { class: 'vacio', text: S.q ? 'Nadie coincide con esa búsqueda.' : (S.filtro === 'faltan' ? 'No falta ningún jefe por responder.' : 'No hay jefes en este grupo.') }));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const j of lista.slice(0, S.mostrar)){
    const d = h('details', { class: `jefe st-${j.estado}`, open: S.abiertos.has(j.key) || (!!S.q && j._viaSub) });
    d.addEventListener('toggle', () => { if (d.open) S.abiertos.add(j.key); else S.abiertos.delete(j.key); });
    const pct = pctTexto(j.hechas, j.total);
    d.append(h('summary', {},
      h('span', { class: 'caret', 'aria-hidden': 'true' }),
      h('span', { class: 'quien' }, h('span', { class: 'nombre', text: j.nombre }), h('span', { class: 'pct', text: pct + '%' }), h('span', { class: 'cuenta', text: `${j.hechas} de ${j.total}` })),
      h('span', { class: 'der' }, h('span', { class: 'mini', 'aria-hidden': 'true', style: `--w:${j.pct.toFixed(1)}%` }, h('i')), (() => { const c = h('span', { class: 'chip' }, icono(j.estado), ETIQ[j.estado]); return c; })())));
    const subs = h('div', { class: 'subs' });
    const pen = j.items.filter(i => !i.resp), hec = j.items.filter(i => i.resp);
    const grupo = (titulo, arr, hecho) => arr.length ? [h('h3', { text: `${titulo} (${arr.length})` }), h('ul', {}, arr.map(i => h('li', { class: 'sub' },
      h('span', {}, h('b', { text: i.sub }), h('span', { class: 'cargo', text: i.cargo })),
      h('span', { class: 'res' }, hecho
        ? [i.resp.ts != null ? fmtDiaHora.format(new Date(i.resp.ts)) : 'Respondida', i.resp.prom != null ? [' · ', h('strong', { text: nf2.format(i.resp.prom) })] : null]
        : 'Pendiente'))))] : [];
    subs.append(...grupo('Falta por evaluar', pen, false), ...grupo('Ya evaluados', hec, true));
    d.append(subs); frag.append(h('li', {}, d));
  }
  ul.append(frag);
  if (lista.length > S.mostrar){
    const quedan = lista.length - S.mostrar;
    ul.append(h('li', { class: 'mas' }, h('button', { class: 'btn line', type: 'button', text: `Mostrar ${Math.min(50, quedan)} más (quedan ${nf0.format(quedan)})`, onclick: () => { S.mostrar += 50; pintarLista(); } })));
  }
}

function csvCampo(v){ const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function descargarCSV(){
  const lista = filtrar(S.datos);
  const filas = [['Jefe', 'Estado', 'Respondidas', 'Total', 'Porcentaje', 'Falta por evaluar']];
  lista.forEach(j => filas.push([j.nombre, ETIQ[j.estado], j.hechas, j.total, pctTexto(j.hechas, j.total) + '%', j.items.filter(i => !i.resp).map(i => i.sub).join(' / ')]));
  const blob = new Blob(['﻿' + filas.map(f => f.map(csvCampo).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `jefes-${S.filtro}-${hoyBogota()}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  aviso(`CSV con ${lista.length} jefes descargado.`);
}
async function copiarNombres(){
  const txt = filtrar(S.datos).map(j => j.nombre).join('\n');
  try{ await navigator.clipboard.writeText(txt); aviso('Nombres copiados al portapapeles.'); }catch(_){ aviso('No pude copiar. Usa "Descargar CSV".'); }
}

/* ---------- Gráficos ---------- */
function bloquePreguntas(D){
  const cab = h('div', { class: 'g-cab' }, h('h2', { text: 'Promedio por pregunta' }),
    h('button', { class: 'lnk', type: 'button', text: S.tablaPreg ? 'Ver gráfico' : 'Ver tabla', onclick: () => { S.tablaPreg = !S.tablaPreg; pintar(); } }));
  const cont = h('div', {});
  if (D.hechas === 0 || D.nProm === 0){ cont.append(h('p', { class: 'nota', text: 'Aparecerá cuando haya cuestionarios respondidos.' })); return h('section', { class: 'g-bloque' }, cab, cont); }
  const etiqueta = p => CONFIG.textos[p] ? `${p} · ${CONFIG.textos[p]}` : p;
  if (S.tablaPreg){
    const t = h('table', { class: 'tab-datos' }, h('thead', {}, h('tr', {}, h('th', { text: 'Pregunta' }), h('th', { text: 'Promedio' }))));
    const tb = h('tbody', {});
    D.bloques.forEach(b => { tb.append(h('tr', {}, h('th', { text: `${b.nombre}`, scope: 'row' }), h('td', { text: b.media == null ? '—' : nf2.format(b.media) })));
      b.preguntas.forEach(p => tb.append(h('tr', {}, h('td', { text: etiqueta(p) }), h('td', { text: D.porPregunta[p].media == null ? '—' : nf2.format(D.porPregunta[p].media) })))); });
    t.append(tb); cont.append(t);
  } else {
    const ticks = h('div', { class: 'eje', 'aria-hidden': 'true' }, h('span'), h('div', {}, ...Array.from({ length: D.escala + 1 }, (_, i) => h('span', { text: String(i) }))), h('span'));
    cont.append(ticks);
    D.bloques.forEach(b => {
      cont.append(h('div', { class: 'bq' }, h('span', { text: b.nombre }), h('span', { text: b.media == null ? '—' : nf2.format(b.media) })));
      b.preguntas.forEach(p => {
        const m = D.porPregunta[p].media;
        const fila = h('div', { class: 'preg', tabindex: '0', role: 'img', 'aria-label': `${etiqueta(p)}: ${m == null ? 'sin datos' : nf2.format(m) + ' de ' + D.escala}` },
          h('span', { class: 'cod', text: p }),
          h('div', { class: 'pista' }, h('div', { class: 'barra', style: `--w:${m == null ? 0 : (m / D.escala * 100).toFixed(2)}%` })),
          h('span', { class: 'val', text: m == null ? '—' : nf2.format(m) }));
        tip(fila, () => [m == null ? 'Sin datos' : `${nf2.format(m)} de ${D.escala}`, `${etiqueta(p)} · ${nf0.format(D.porPregunta[p].n)} respuestas`]);
        cont.append(fila);
      });
    });
  }
  return h('section', { class: 'g-bloque' }, cab, cont);
}

function bloqueDias(D){
  const cab = h('div', { class: 'g-cab' }, h('h2', { text: 'Cuestionarios por día' }),
    h('button', { class: 'lnk', type: 'button', text: S.tablaDias ? 'Ver gráfico' : 'Ver tabla', onclick: () => { S.tablaDias = !S.tablaDias; pintar(); } }));
  const cont = h('div', { class: 'dias' });
  const dias = [...D.dias.keys()].sort();
  if (!dias.length){ cont.append(h('p', { class: 'nota', text: 'Aparecerá cuando haya cuestionarios con fecha.' })); return h('section', { class: 'g-bloque' }, cab, cont); }
  const hoy = hoyBogota(); let fin = dias[dias.length - 1] > hoy ? dias[dias.length - 1] : hoy;
  let ini = dias[0]; if (diasEntre(ini, fin) > 30) ini = sumaDias(fin, -30);
  const serie = []; for (let d = ini; d <= fin; d = sumaDias(d, 1)) serie.push({ dia: d, n: D.dias.get(d) || 0 });
  const nombreDia = d => fmtDia.format(new Date(Date.parse(d + 'T00:00:00Z')));
  if (S.tablaDias){
    const t = h('table', { class: 'tab-datos' }, h('thead', {}, h('tr', {}, h('th', { text: 'Día' }), h('th', { text: 'Cuestionarios' }))));
    const tb = h('tbody', {}); [...serie].reverse().forEach(s => tb.append(h('tr', {}, h('td', { text: nombreDia(s.dia) }), h('td', { text: nf0.format(s.n) })))); t.append(tb); cont.append(t);
  } else {
    cont.dataset.serie = JSON.stringify(serie);
    queueMicrotask(() => dibujarDias(cont, serie, nombreDia));
  }
  return h('section', { class: 'g-bloque' }, cab, cont);
}

const nombreDiaGlobal = d => fmtDia.format(new Date(Date.parse(d + 'T00:00:00Z')));
function dibujarDias(cont, serie, nombreDia){
  const W = Math.max(260, cont.clientWidth || 360); cont._w = cont.clientWidth;
  const H = 170, izq = 30, der = 4, arr = 22, aba = 26;
  const pw = W - izq - der, ph = H - arr - aba;
  const maxN = Math.max(1, ...serie.map(s => s.n));
  const paso = maxN <= 5 ? 1 : maxN <= 10 ? 2 : maxN <= 30 ? 5 : maxN <= 60 ? 10 : maxN <= 150 ? 25 : 50;
  const tope = Math.max(paso, Math.ceil(maxN / paso) * paso);
  const y = v => arr + ph - v / tope * ph;
  const slot = pw / serie.length, bw = Math.min(24, slot * 0.62);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H + 12}`, role: 'img', 'aria-label': 'Cuestionarios respondidos por día' });
  const ticks = tope % 2 === 0 && tope > 2 ? [0, tope / 2, tope] : [0, tope];
  ticks.forEach(v => svg.append(
    sv('line', { x1: izq, x2: W - der, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }),
    sv('text', { x: izq - 8, y: y(v) + 4, 'text-anchor': 'end' }, document.createTextNode(String(v)))));
  const cadaN = Math.max(1, Math.ceil(26 / slot));
  const maxI = serie.reduce((m, s, i) => s.n > serie[m].n ? i : m, 0);
  serie.forEach((s, i) => {
    const cx = izq + slot * (i + .5), x = cx - bw / 2, ytop = y(s.n), alto = arr + ph - ytop;
    svg.append(sv('rect', { class: 'hit', x: izq + slot * i, y: arr - 6, width: slot, height: ph + 6 + aba - 4, tabindex: '0', 'aria-label': `${nombreDia(s.dia)}: ${s.n} cuestionarios` }));
    const hit = svg.lastChild; tip(hit, () => [`${nf0.format(s.n)} cuestionarios`, nombreDia(s.dia)]);
    if (s.n > 0){
      const r = Math.min(4, alto, bw / 2);
      svg.append(sv('path', { class: 'col-d', fill: 'var(--s1)', d: `M${x},${arr + ph} V${ytop + r} Q${x},${ytop} ${x + r},${ytop} H${x + bw - r} Q${x + bw},${ytop} ${x + bw},${ytop + r} V${arr + ph} Z` }));
    } else svg.append(sv('g', { class: 'col-d' }));
    if (i % cadaN === 0 || i === serie.length - 1){
      const d = new Date(Date.parse(s.dia + 'T00:00:00Z'));
      svg.append(sv('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, document.createTextNode(String(d.getUTCDate()))));
      if (i === 0 || d.getUTCDate() === 1)
        svg.append(sv('text', { x: cx, y: H + 6, 'text-anchor': i === 0 ? 'start' : 'middle', style: 'font-weight:600' }, document.createTextNode(fmtMes.format(d).replace('.', ''))));
    }
    if (s.n > 0 && (i === maxI || i === serie.length - 1 || serie.length <= 8))
      svg.append(sv('text', { class: 'v', x: cx, y: ytop - 5, 'text-anchor': 'middle' }, document.createTextNode(String(s.n))));
  });
  cont.replaceChildren(svg);
  cont.dataset.serie = JSON.stringify(serie);
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => {
  const c = $('.dias[data-serie]'); if (c && c.clientWidth !== c._w) dibujarDias(c, JSON.parse(c.dataset.serie), nombreDiaGlobal); }, 150); });

/* ---------- Revisión de datos ---------- */
function revision(D){
  const avisos = [];
  if (D.huerfanas.length) avisos.push(['Respuestas que no coinciden con ninguna relación jefe–subordinado (no cuentan en el avance ni en el promedio):', D.huerfanas.slice(0, 8).map(r => `${bonito(r.jefe)} → ${bonito(r.sub)}`), D.huerfanas.length > 8 ? `…y ${D.huerfanas.length - 8} más` : null]);
  if (D.repetidas) avisos.push([`${D.repetidas} cuestionario(s) repetido(s) para el mismo jefe y subordinado. Se cuenta solo el más reciente.`, [], null]);
  if (D.relRepetidas) avisos.push([`${D.relRepetidas} relación(es) repetida(s) en la lista Relaciones. Se cuentan una sola vez.`, [], null]);
  if (S.descartadas) avisos.push([`${S.descartadas} fila(s) de Respuestas sin jefe o subordinado, descartadas.`, [], null]);
  if (!avisos.length) return h('div', {});
  const det = h('details', { class: 'calidad' }, h('summary', { text: `Revisión de datos (${avisos.length} ${avisos.length === 1 ? 'aviso' : 'avisos'})` }));
  const c = h('div', { class: 'cuerpo-q' });
  avisos.forEach(([t, items, mas]) => { c.append(h('p', { style: 'margin:10px 0 2px', text: t })); if (items.length) c.append(h('ul', {}, items.map(x => h('li', { text: x })))); if (mas) c.append(h('p', { style: 'margin:0', text: mas })); });
  det.append(c); return det;
}

/* ---------- Tooltip ---------- */
const TIP = $('#tip');
function tip(el, fn){
  const mostrar = (x, y) => {
    const [a, b] = fn(); TIP.replaceChildren(h('strong', { text: a }), document.createTextNode(b)); TIP.classList.add('on');
    const r = TIP.getBoundingClientRect(); let px = x + 14, py = y + 16;
    if (px + r.width > innerWidth - 8) px = x - r.width - 14; if (py + r.height > innerHeight - 8) py = y - r.height - 12;
    TIP.style.left = Math.max(8, px) + 'px'; TIP.style.top = Math.max(8, py) + 'px';
  };
  el.addEventListener('pointermove', e => mostrar(e.clientX, e.clientY));
  el.addEventListener('pointerleave', () => TIP.classList.remove('on'));
  el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); mostrar(r.left + r.width / 2, r.top); });
  el.addEventListener('blur', () => TIP.classList.remove('on'));
}

/* ---------- Tema ---------- */
function aplicarTema(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
try{ aplicarTema(localStorage.getItem('tema')); }catch(_){}
$('#btnTema').addEventListener('click', () => {
  const actual = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  const nuevo = actual === 'dark' ? 'light' : 'dark'; aplicarTema(nuevo); try{ localStorage.setItem('tema', nuevo); }catch(_){}
});
$('#btnActualizar').addEventListener('click', abrirDialogo);
$('#dlgCerrar').addEventListener('click', cerrarDialogo);

/* ---------- Arranque ---------- */
pintar();
if (window.opener && location.hash === '#sp'){
  const espera = h('p', { class: 'nota', style: 'margin-top:20px', text: 'Esperando los datos de SharePoint…' });
  $('#app').prepend(espera);
  try{ window.opener.postMessage({ tipo: 'eval-listo' }, '*'); }catch(_){}
  setTimeout(() => { if (!S.datos) espera.textContent = 'No llegaron datos de SharePoint. Mira el aviso en la pestaña de SharePoint o carga los archivos aquí abajo.'; }, 15000);
}
})();
