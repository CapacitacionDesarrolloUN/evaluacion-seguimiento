  --bg:#F6F4F3; --surface:#FFFFFF; --line:#E6E1DF; --fg:#1C1A1A; --muted:#6F6866;
  --realce:#FFF7D1;                         /* roble muy suave: hover y selección */
  /* Estados de jefe: siempre con ícono y texto, nunca solo color */
  --sin-bg:#FDECEA;   --sin-ink:#8E1B1B;   --sin-c:#B22A32;
  --curso-bg:#FFF1BF; --curso-ink:#5D4300; --curso-c:#A66F00;
  --ok-bg:#E3F3E4;    --ok-ink:#174D1C;    --ok-c:#2E7D32;
  /* Gráficos */
  --barra:#CB333B; --grid:#E4DFDD; --axis:#BDB5B2; --focus:#0B3A66; --err:#9E1F27;
  --f-display:"Nunito","Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Nunito","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --banda:#4A0F15; --bg:#141212; --surface:#1E1B1B; --line:#332E2D; --fg:#F2EEEC; --muted:#A89F9C; --realce:#2B2512;
  --rojo:#B82D35; --sin-bg:#3B1A1A; --sin-ink:#F4B4B4; --sin-c:#E8636B;
  --curso-bg:#3A3212; --curso-ink:#FFE08A; --curso-c:#E5B93C; --ok-bg:#16301A; --ok-ink:#B5E3B7; --ok-c:#6FC17A;
  --barra:#E8636B; --grid:#2C2827; --axis:#463F3D; --focus:#FFCD00; --err:#F4B4B4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --banda:#4A0F15; --bg:#141212; --surface:#1E1B1B; --line:#332E2D; --fg:#F2EEEC; --muted:#A89F9C; --realce:#2B2512;
  --rojo:#B82D35; --sin-bg:#3B1A1A; --sin-ink:#F4B4B4; --sin-c:#E8636B;
  --curso-bg:#3A3212; --curso-ink:#FFE08A; --curso-c:#E5B93C; --ok-bg:#16301A; --ok-ink:#B5E3B7; --ok-c:#6FC17A;
  --barra:#E8636B; --grid:#2C2827; --axis:#463F3D; --focus:#FFCD00; --err:#F4B4B4;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--roble);color:var(--negro);padding:8px 14px;border-radius:6px;font-weight:600;z-index:50}
.skip:focus{left:12px}

/* Franja de marca: encabezado + mapa de avance */
.top{background:var(--banda);color:#fff}
.top-in{display:flex;align-items:center;gap:14px 22px;padding:20px 0 18px;flex-wrap:wrap}
.logo{width:150px;aspect-ratio:331/92;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.ttl{flex:1 1 300px;min-width:0;border-left:1px solid rgba(255,255,255,.35);padding-left:22px}
h1{margin:0;font:700 clamp(22px,2.7vw,28px)/1.1 var(--f-display);letter-spacing:-.01em}
.ttl p{margin:5px 0 0;color:rgba(255,255,255,.84);font-size:14.5px}
.acts{display:flex;gap:10px;align-items:center}
.rule{height:5px;background:var(--roble)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:8px;border:1.5px solid transparent;font-weight:600;font-size:15px;line-height:1.1;cursor:pointer;background:none;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.amarillo{background:var(--roble);color:var(--negro)}
.btn.amarillo:hover{background:#ffd93d}
.btn.ghost{color:#fff;border-color:rgba(255,255,255,.5);padding:10px}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.line:hover{border-color:var(--fg)}
.btn.rojo{background:var(--rojo-hondo);color:#fff}
.btn.rojo:hover{background:var(--banda)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top :focus-visible{outline-color:#fff}

.hero-slot:empty{display:none}
.hero{display:grid;grid-template-columns:minmax(300px,.78fr) minmax(0,1.5fr);gap:26px 60px;padding:16px 0 28px;align-items:start}
.etq{margin:0;font:600 14px/1.3 var(--f-body);color:rgba(255,255,255,.84)}
.cifra{font:800 clamp(92px,11vw,148px)/.84 var(--f-display);letter-spacing:-.05em;margin:12px 0 10px;color:#fff;font-variant-numeric:lining-nums}
.cifra small{font-size:.34em;letter-spacing:0;margin-left:5px;color:var(--roble)}
.cifra-sub{font-size:18px;margin:0 0 24px;color:#fff}
.datos{display:flex;flex-wrap:wrap;gap:14px 0}
.datos div{padding:0 22px;border-left:1px solid rgba(255,255,255,.3)}
.datos div:first-child{padding-left:0;border-left:0}
.datos b{display:block;font:700 30px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.datos span{display:block;margin-top:7px;font-size:13px;color:rgba(255,255,255,.8)}
.jefes{margin-top:26px}
.jefes-estado{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px}
.jefes-estado button{display:inline-flex;gap:7px;align-items:center;border:1.5px solid rgba(255,255,255,.42);background:none;color:#fff;border-radius:999px;padding:8px 14px 8px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.jefes-estado button:hover{background:rgba(255,255,255,.14)}
.jefes-estado svg{width:15px;height:15px}
.jefes-estado .n{font-variant-numeric:tabular-nums;font-weight:600}

/* Mapa de cuestionarios: un cuadro por cuestionario, un bloque por jefe */
.mapa{min-width:0}
.mapa-cab{display:flex;justify-content:space-between;align-items:baseline;gap:6px 20px;flex-wrap:wrap;margin-bottom:14px}
.mapa-cab h2{margin:0;font:700 17px/1.3 var(--f-display);color:#fff}
.clave{display:flex;gap:18px;font-size:13px;color:rgba(255,255,255,.88)}
.clave i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.clave .si i{background:var(--roble)}
.clave .no i{background:rgba(255,255,255,.22)}
.mosaico{display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:var(--gb,10px);min-height:200px}
.eq{display:grid;grid-template-columns:repeat(var(--cols),var(--c));gap:var(--g);cursor:pointer;border-radius:3px}
.eq i{width:var(--c);height:var(--c);border-radius:calc(var(--c)*.24);background:rgba(255,255,255,.22)}
.eq i.h{background:var(--roble)}
.eq:hover{outline:2px solid #fff;outline-offset:3px}
.mapa-pie{margin:14px 0 0;font-size:13px;color:rgba(255,255,255,.8);max-width:62ch}
@keyframes brota{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes enciende{from{background:rgba(255,255,255,.22)}}
.mosaico.anima .eq i{animation:brota .38s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--k)*5ms)}
.mosaico.anima .eq i.h{animation:brota .38s cubic-bezier(.2,.8,.3,1) both,enciende .6s ease-out both;animation-delay:calc(var(--k)*5ms),calc(var(--k)*5ms + 380ms)}

/* Corte y cierre */
.corte{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 28px;padding:13px 0 15px;border-top:1px solid rgba(255,255,255,.22);font-size:13.5px;color:rgba(255,255,255,.84)}
.corte b{color:#fff;font-weight:600}
.corte .cierre{color:#fff;font-weight:600}
.corte .cierre::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--roble);margin-right:8px;vertical-align:1px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--roble);color:var(--negro);font-weight:700;font-size:13px;margin-right:8px}
.nota{margin:10px 0 0;color:var(--muted);font-size:14px}

/* Cuerpo */
.cuerpo{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:44px;margin:40px 0 20px;align-items:start}
.col h2.grande{font:700 26px/1.2 var(--f-display);letter-spacing:-.01em;margin:0 0 4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.herram{padding:16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:baseline}
.tab span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--rojo-hondo);color:#fff;border-color:var(--rojo-hondo)}
.tab[aria-pressed="true"] span{color:inherit;opacity:.85}
.fila-h{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.buscar{flex:1 1 220px;position:relative}
.buscar input{width:100%;padding:10px 12px 10px 38px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.buscar input:focus-visible{outline-offset:0}
.buscar svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
select{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.conteo .acc{display:flex;gap:18px}
.lnk[disabled]{opacity:.4;cursor:not-allowed}
.conteo{padding:10px 16px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.lista{list-style:none;margin:0;padding:0}
.lista>li+li{border-top:1px solid var(--line)}
.jefe summary{list-style:none;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;cursor:pointer}
.jefe summary::-webkit-details-marker{display:none}
.jefe summary:hover{background:var(--realce)}
.jefe{scroll-margin-top:16px}
.jefe[open]>summary{background:var(--realce)}
.jefe.resalta{animation:resalta 1.6s ease-out}
@keyframes resalta{0%,40%{box-shadow:inset 0 0 0 3px var(--roble)}100%{box-shadow:inset 0 0 0 3px transparent}}
.caret{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:3px}
.jefe[open] .caret{transform:rotate(45deg)}
.quien{display:flex;align-items:baseline;gap:6px 11px;flex-wrap:wrap;min-width:0}
.nombre{font-weight:600;overflow-wrap:anywhere}
.pct{display:inline-block;padding:1px 9px;border-radius:999px;font:700 13.5px/1.5 var(--f-display);font-variant-numeric:tabular-nums;background:var(--bgst);color:var(--inkst)}
.cuenta{color:var(--muted);font-size:14px}
.der{display:flex;align-items:center;gap:12px}
.mini{width:96px;height:8px;border-radius:4px;background:var(--bgst);overflow:hidden}
.mini i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--bgst);color:var(--inkst);white-space:nowrap}
.chip svg{width:14px;height:14px;flex:none}
.lista.uno .chip{display:none}
.st-sin{--c:var(--sin-c);--bgst:var(--sin-bg);--inkst:var(--sin-ink)}
.st-curso{--c:var(--curso-c);--bgst:var(--curso-bg);--inkst:var(--curso-ink)}
.st-ok{--c:var(--ok-c);--bgst:var(--ok-bg);--inkst:var(--ok-ink)}
.subs{padding:2px 16px 16px 46px}
.subs h3{margin:12px 0 4px;font:600 14px/1.3 var(--f-body);color:var(--muted)}
.subs ul{list-style:none;margin:0;padding:0}
.sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.sub:first-child{border-top:0}
.sub b{font-weight:600;overflow-wrap:anywhere}
.sub .cargo{display:block;color:var(--muted);font-size:14px;font-weight:400}
.sub .res{text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub .res strong{color:var(--fg);font-weight:600}
.vacio{padding:34px 20px;text-align:center;color:var(--muted)}
.mas{padding:16px;text-align:center}

/* Columna de gráficos */
.col+.col{position:static}
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 18px;margin-bottom:38px}
.ficha h2{margin:0 0 6px;font:600 14px/1.3 var(--f-body);color:var(--muted)}
.ficha .num{font:700 clamp(60px,6vw,76px)/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:lining-nums}
.ficha .num small{font:700 .3em/1 var(--f-display);letter-spacing:0;color:var(--muted);margin-left:8px}
.ficha .nota{margin:10px 0 0}
.g-bloque+.g-bloque{margin-top:38px}
.g-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.g-cab h2{margin:0;font:700 18px/1.2 var(--f-display);color:var(--fg)}
.lnk{background:none;border:0;color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 2px;min-height:28px}
.eje{display:grid;grid-template-columns:46px 1fr 50px;gap:10px;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.eje div{display:flex;justify-content:space-between}
.bq{margin:18px 0 4px;display:flex;justify-content:space-between;font:700 15px/1.3 var(--f-display)}
.bq span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.preg{display:grid;grid-template-columns:46px 1fr 50px;gap:10px;align-items:center;min-height:30px;border-radius:6px}
.preg:hover,.preg:focus-visible{background:var(--realce)}
.preg .cod{font-weight:600;font-size:14px}
.preg .pista{position:relative;height:16px;background:linear-gradient(to right,var(--grid) 1px,transparent 1px) 0 0/calc(100% / var(--esc,5)) 100%;border-right:1px solid var(--grid)}
.preg .barra{position:absolute;left:0;top:50%;height:3px;translate:0 -50%;width:var(--w);background:var(--barra);border-radius:2px}
.preg .punto{position:absolute;top:50%;left:var(--w);width:12px;height:12px;translate:-50% -50%;border-radius:50%;background:var(--barra);box-shadow:0 0 0 2.5px var(--surface)}
.preg .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
table.tab-datos{width:100%;border-collapse:collapse;font-size:14.5px}
.tab-datos th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tab-datos td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tab-datos th:last-child,.tab-datos td:last-child{text-align:right;padding-right:0}
.dias svg{display:block;width:100%;height:auto;overflow:visible}
.dias text{font:400 12px var(--f-body);fill:var(--muted)}
.dias .v{font-weight:600;fill:var(--fg);font-size:12.5px}
.dias .hit{fill:transparent}
.dias .col-d{pointer-events:none}
.dias .hit:hover+.col-d,.dias .hit:focus-visible+.col-d{filter:brightness(1.15)}
.dias .hit:focus-visible{outline:none;stroke:var(--focus);stroke-width:2}

/* Revisión de datos */
.calidad{margin:30px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.calidad summary{padding:14px 18px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center}
.calidad .cuerpo-q{padding:0 18px 16px;color:var(--muted);font-size:15px}
.calidad ul{margin:6px 0 10px;padding-left:20px}
.calidad li{margin:2px 0;color:var(--fg)}
.pie{padding:26px 0 40px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}

/* Bienvenida / cargador */
.bienvenida{padding:48px 0 30px;max-width:900px}
.bienvenida h2{font:700 clamp(26px,3.4vw,38px)/1.15 var(--f-display);margin:0 0 10px;letter-spacing:-.015em}
.bienvenida>p{font-size:18px;margin:0 0 28px;color:var(--muted);max-width:62ch}
.cargador{display:grid;gap:24px}
.paso{padding-top:24px;border-top:1px solid var(--line)}
.paso:first-child{padding-top:0;border-top:0}
.paso h3{margin:0 0 6px;font:700 19px/1.3 var(--f-display)}
.paso p{margin:0 0 10px;color:var(--muted);max-width:64ch}
.paso ol{margin:0 0 12px;padding-left:20px;color:var(--muted);max-width:64ch}
.paso ol li{margin:2px 0}
.fav{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;background:var(--roble);color:var(--negro);font-weight:700;text-decoration:none;border:2px dashed var(--negro);cursor:grab}
.fav svg{width:18px;height:18px}
.zona{border:2px dashed var(--axis);border-radius:12px;padding:26px 20px;text-align:center;background:var(--surface);transition:border-color .12s,background .12s}
.zona.sobre{border-color:var(--rojo);background:var(--realce)}
.zona p{margin:0 0 12px;color:var(--muted);max-width:none}
.zona input{display:none}
.aviso-c{min-height:1.6em;font-weight:600;margin:0}
.aviso-c.err{color:var(--err)}
.priv{margin:0;color:var(--muted);font-size:14.5px;border-left:3px solid var(--roble);padding-left:12px;max-width:66ch}
dialog{border:0;border-radius:14px;padding:26px 28px;max-width:min(760px,calc(100% - 28px));width:100%;background:var(--bg);color:var(--fg);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,16,16,.55)}
.dlg-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-cab h2{margin:0;font:700 22px/1.2 var(--f-display)}

/* Tooltip y aviso */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--fg);color:var(--surface);padding:8px 11px;border-radius:8px;font-size:13.5px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:260px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip strong{display:block;font-size:15px}
#toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;background:var(--fg);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
noscript p{padding:30px}


/* Aspecto amable y animaciones */
:root{--naranja:#F0761F;--sombra:0 14px 34px -22px rgba(70,20,25,.45);--sombra2:0 20px 40px -20px rgba(70,20,25,.5)}
@keyframes subir{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes llena{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sube-col{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes dibuja{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes funde{from{opacity:0}to{opacity:1}}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(255,205,0,.6)}60%{box-shadow:0 0 0 7px rgba(255,205,0,0)}}
.entra>*{animation:subir .65s cubic-bezier(.2,.8,.25,1) both}
.entra>*:nth-child(2){animation-delay:.08s}.entra>*:nth-child(3){animation-delay:.16s}.entra>*:nth-child(4){animation-delay:.24s}
.entra .preg .barra{transform-origin:left;animation:llena .85s cubic-bezier(.2,.8,.25,1) .25s both}
.entra .preg .punto{animation:pop .4s ease-out .9s both}
.entra .col-d{transform-box:fill-box;transform-origin:bottom;animation:sube-col .7s cubic-bezier(.2,.8,.25,1) .3s both}
.lista.anima>li{animation:subir .4s ease-out both}
.lista.anima>li:nth-child(2){animation-delay:.03s}.lista.anima>li:nth-child(3){animation-delay:.06s}.lista.anima>li:nth-child(4){animation-delay:.09s}.lista.anima>li:nth-child(5){animation-delay:.12s}.lista.anima>li:nth-child(6){animation-delay:.15s}.lista.anima>li:nth-child(7){animation-delay:.18s}.lista.anima>li:nth-child(8){animation-delay:.21s}
.lista.anima .mini i{transform-origin:left;animation:llena .7s cubic-bezier(.2,.8,.25,1) .2s both}
.jefe[open] .subs{animation:subir .32s ease-out both}
.cierre::before{animation:latido 2.2s ease-out infinite}
dialog[open]{animation:subir .3s cubic-bezier(.2,.8,.25,1)}
dialog[open]::backdrop{animation:funde .25s ease-out}
.panel,.ficha,.calidad{border-radius:20px;box-shadow:var(--sombra);border-color:transparent}
.ficha{transition:transform .25s ease,box-shadow .25s ease}
.ficha:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.btn{border-radius:12px;transition:transform .15s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.tab{transition:background .2s ease,color .2s ease,border-color .2s ease,transform .15s ease}
.tab:active{transform:scale(.96)}
.jefes-estado button{transition:background .2s ease,transform .15s ease}
.jefes-estado button:hover{transform:translateY(-1px)}
.eq{transition:transform .18s ease}.eq:hover{transform:scale(1.08)}
.jefe summary{transition:background .2s ease}
.mini i,.rk-barra i{transition:width .35s ease}
.buscar input,select{border-radius:12px;transition:border-color .2s ease,box-shadow .2s ease}
.buscar input:focus{border-color:var(--rojo);box-shadow:0 0 0 4px rgba(203,51,59,.12)}
.caret{transition:transform .22s ease}

/* Buscar por */
.seg{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg>span{font-size:14px;font-weight:600;color:var(--muted)}
.seg-in{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg-in button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer;transition:background .2s ease,color .2s ease}
.seg-in button[aria-pressed="true"]{background:var(--rojo-hondo);color:#fff}
.sub.clic{cursor:pointer;border-radius:8px;transition:background .2s ease;margin-inline:-8px;padding-inline:8px}
.sub.clic:hover{background:var(--realce)}
.fsub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:12px 16px;transition:background .2s ease}
.fsub.clic{cursor:pointer}.fsub.clic:hover{background:var(--realce)}
.fsub-q{min-width:0}
.fsub-nom{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.fsub-nom b{font-weight:700;overflow-wrap:anywhere}
.jefe-al{color:var(--rojo-hondo);font-size:14px;font-weight:600}
:root[data-theme="dark"] .jefe-al{color:var(--roble)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jefe-al{color:var(--roble)}}
.fsub .cargo{display:block;color:var(--muted);font-size:14px}
.fsub .res{text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.fsub .res strong{color:var(--fg);font-weight:600}
@media (max-width:640px){.fsub{grid-template-columns:minmax(0,1fr)}.fsub .res{text-align:left}}
.ver{display:block;color:var(--rojo-hondo);font-weight:700;font-size:13.5px}
:root[data-theme="dark"] .ver{color:var(--roble)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ver{color:var(--roble)}}

/* Accesos y secciones */
.accesos{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;scroll-margin-top:14px}
.acceso{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:14px;border:0;background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--sombra);transition:transform .18s ease,background .2s ease,color .2s ease}
.acceso svg{width:19px;height:19px;flex:none;color:var(--rojo)}
.acceso:hover{transform:translateY(-2px)}.acceso:active{transform:scale(.97)}
.acceso[aria-pressed="true"]{background:var(--rojo-hondo);color:#fff}.acceso[aria-pressed="true"] svg{color:var(--roble)}
.seccion{margin-top:16px;background:var(--surface);border-radius:20px;padding:22px 24px;box-shadow:var(--sombra);animation:subir .4s cubic-bezier(.2,.8,.25,1) both}
.sec-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 24px;flex-wrap:wrap;margin-bottom:12px}
.sec-cab h2{margin:0;font:700 23px/1.2 var(--f-display)}
.sec-cab>div:first-child{flex:1 1 320px;min-width:0}
.sec-cab .nota{margin-top:4px;max-width:78ch}
.sec-acc{display:flex;gap:8px;align-items:center}
.filtro{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--sombra2);animation:subir .2s ease-out both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.menu button:hover{background:var(--realce)}
.menu i{width:14px;height:14px;border-radius:50%;border:2px solid var(--axis);flex:none}
.menu [aria-checked="true"] i{border:4.5px solid var(--rojo-hondo)}
.rk-lista{list-style:none;margin:0;padding:0}
.rk-lista li+li{border-top:1px solid var(--line)}
.rk-lista li{animation:subir .35s ease-out both}
.rk{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 56px;gap:4px 12px;align-items:center;width:100%;padding:11px 8px;background:none;border:0;border-radius:10px;cursor:pointer;text-align:left;transition:background .2s ease}
.rk:hover{background:var(--realce)}
.rk-pos{font:800 18px/1 var(--f-display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rk-nom b{display:block;font-weight:700;overflow-wrap:anywhere}
.rk-nom span{display:block;color:var(--muted);font-size:13.5px}
.rk-barra{height:9px;border-radius:5px;background:var(--grid);overflow:hidden}
.rk-barra i{display:block;height:100%;width:var(--w);background:var(--naranja);border-radius:5px;transform-origin:left;animation:llena .7s cubic-bezier(.2,.8,.25,1) both}
.rk-val{font:800 18px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.elige{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-weight:600}
.elige select{flex:1 1 240px;max-width:560px;min-width:0}
.linea svg{display:block;width:100%;height:auto;overflow:visible}
.linea text{font:600 12px var(--f-body);fill:var(--muted)}
.linea .tit{font-weight:800;fill:var(--fg);font-size:13px}
.linea .cod{fill:var(--fg);font-weight:700}
.linea .v{fill:var(--fg);font-weight:700;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
#dlgR .linea .v{stroke:var(--bg)}
@media (max-width:520px){.linea .v{font-size:10.5px}}
.linea .hit{fill:transparent;cursor:help}
.linea .hit:focus-visible{outline:none;stroke:var(--focus);stroke-width:2}
.linea .hit:hover{fill:rgba(240,118,31,.08)}
.linea .anima .trazo{stroke-dasharray:1;animation:dibuja 1.1s ease-out both}
.linea .anima .pt{transform-box:fill-box;transform-origin:center;animation:pop .36s ease-out both;animation-delay:calc(var(--i)*80ms + 120ms)}
.linea .anima .v{animation:funde .3s ease-out both;animation-delay:calc(var(--i)*80ms + 260ms)}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px 34px}
.glos h3{margin:10px 0 6px;font:800 16px/1.3 var(--f-display);color:var(--rojo-hondo)}
.glos dl{margin:0}
.glos dl>div{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.glos dt{font-weight:800}
.glos dd{margin:0;font-size:14.5px;color:var(--muted)}
.glos dd b{display:block;color:var(--fg);font-size:15px}
.pie-preg{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:12px}
.preg{padding-block:3px}
.preg .txt{grid-column:2/4;font-size:12.5px;line-height:1.2;color:var(--muted);margin-top:-5px}
#dlgR,#dlgJ{max-width:min(860px,calc(100% - 28px))}
#dlgJ .dlg-cab{align-items:flex-start;gap:14px}
.res-num{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.res-num div{background:var(--surface);border-radius:14px;padding:12px 14px}
.res-num span{display:block;color:var(--muted);font-size:13px;font-weight:600}
.res-num b{font:800 28px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.res-num .bq-n b{font-size:22px}
#dlgJ h3{margin:18px 0 4px;font:800 15.5px/1.3 var(--f-display);color:var(--rojo-hondo)}
#dlgJ .lista{background:var(--surface);border-radius:14px;overflow:hidden}
.res-acc{margin-top:16px;text-align:right}
:root[data-theme="dark"] :is(#dlgJ h3,.cq-b h3,.glos h3){color:var(--roble)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(#dlgJ h3,.cq-b h3,.glos h3){color:var(--roble)}}
#arriba{position:fixed;right:22px;bottom:22px;z-index:60;width:50px;height:50px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--rojo-hondo);color:#fff;cursor:pointer;box-shadow:0 12px 26px -10px rgba(50,10,15,.7);opacity:0;visibility:hidden;transform:translateY(14px) scale(.85);transition:opacity .25s ease,transform .25s cubic-bezier(.2,.8,.25,1),visibility .25s,background .2s ease}
#arriba.on{opacity:1;visibility:visible;transform:none}
#arriba.on:hover{transform:translateY(-3px);background:var(--banda)}
#arriba.on:active{transform:scale(.94)}
#arriba svg{width:24px;height:24px}
@media print{#arriba{display:none}}
@media (max-width:640px){#arriba{right:14px;bottom:14px;width:46px;height:46px}}
#dlgR .dlg-cab{align-items:flex-start;gap:14px}
.resp-meta{margin:-8px 0 14px;color:var(--muted)}
.resp-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ficha-m span{display:block;color:var(--muted);font-size:13.5px;font-weight:600}
.ficha-m b{font:800 38px/1 var(--f-display)}
.cq-b h3{margin:16px 0 2px;font:800 15.5px/1.3 var(--f-display);color:var(--rojo-hondo)}
.cq{padding:10px 0;border-top:1px solid var(--line)}
.cq p{margin:0 0 5px;font-size:14.5px}
.cq-r{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;flex-wrap:wrap}
.cq-puntos{display:inline-flex;gap:4px}
.cq-puntos i{width:11px;height:11px;border-radius:50%;background:var(--grid)}
.cq-puntos i.si{background:var(--naranja)}
@media (max-width:640px){
  .acceso{width:100%}
  .rk{grid-template-columns:34px minmax(0,1fr) 50px}
  .rk-barra{display:none}
  .seccion{padding:18px 16px}
  .seg{width:100%}
}
@media (forced-colors:active){.cq-puntos i{forced-color-adjust:none;background:Canvas;border:1px solid CanvasText}.cq-puntos i.si{background:Highlight}.rk-barra{border:1px solid CanvasText}.rk-barra i{forced-color-adjust:none;background:Highlight}}

@media (max-width:1000px){
  .cuerpo{grid-template-columns:1fr;gap:40px}
  .hero{grid-template-columns:1fr;gap:30px;padding-bottom:24px}
}
@media (max-width:640px){
  .top-in{gap:12px 12px;padding:16px 0 14px}
  .logo{width:104px}
  .btn{padding:9px 12px}
  .ttl{border-left:0;padding-left:0;flex-basis:100%;order:3}
  .datos div{padding:0 16px}
  .datos b{font-size:26px}
  .corte{flex-direction:column}
  .acts{margin-left:auto}
  .btn .t{display:none}
  .btn.amarillo .t{display:inline}
  .jefe summary{grid-template-columns:18px minmax(0,1fr)}
  .der{grid-column:2}
  .subs{padding-left:16px}
  .sub{grid-template-columns:minmax(0,1fr)}
  .sub .res{text-align:left}
  .mini{width:80px}
  dialog{padding:20px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (forced-colors:active){
  .logo{background:CanvasText}
  .eq i{forced-color-adjust:none;background:Canvas;border:1px solid CanvasText}
  .eq i.h{background:Highlight;border-color:Highlight}
  .clave i{forced-color-adjust:none;border:1px solid CanvasText}
  .clave .si i{background:Highlight;border-color:Highlight}
  .clave .no i{background:Canvas}
  .preg .barra,.preg .punto{forced-color-adjust:none;background:Highlight}
  .mini{border:1px solid CanvasText}.mini i{forced-color-adjust:none;background:Highlight}
  .dias .col-d{forced-color-adjust:none;fill:Highlight}
  .top{border-bottom:1px solid CanvasText}
}
@media print{.top .acts,.herram,.lnk,.skip{display:none}.panel{border:0}.jefe{break-inside:avoid}}

/* Selector de secciones: Evaluación / SST / ELT */
.selector{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);flex:none;font-family:"Montserrat","Nunito","Segoe UI",system-ui,sans-serif}
.selector::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--sel-ind);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.7,0,.25,1)}
.selector button{position:relative;z-index:1;border:0;background:none;color:#fff;cursor:pointer;padding:7px 14px;border-radius:10px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;min-width:104px;transition:color .4s;font:inherit}
.selector button b{font-size:14.5px;font-weight:800;letter-spacing:.01em}
.selector button span{font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.selector button[aria-pressed="true"]{color:var(--sel-tx)}
.selector button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.1)}
.selector button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:760px){.selector{order:3;width:100%}.selector button{min-width:0;padding:7px 10px}}

/* ===== Secciones (Evaluación / SST / ELT) ===== */
#sondeosHost{display:block}
#sondeosHost[hidden]{display:none}
.top .selector{--i:0;--sel-ind:var(--roble);--sel-tx:var(--negro)}
.telon{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;color:#fff;pointer-events:none;overflow:hidden;font-family:"Montserrat","Nunito","Segoe UI",system-ui,sans-serif}
.telon[data-to="eval"]{background:radial-gradient(900px 500px at 85% 0%,rgba(203,51,59,.65),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(255,205,0,.22),transparent 60%),#7E1820}
.telon[data-to="sst"]{background:radial-gradient(900px 500px at 85% 0%,rgba(46,125,240,.6),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(242,138,30,.3),transparent 60%),#0B2A5C}
.telon[data-to="elt"]{background:radial-gradient(900px 500px at 85% 0%,rgba(194,40,48,.65),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(227,163,58,.32),transparent 60%),#4A0B12}
.telon-in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px}
.telon-k{font-size:clamp(96px,18vw,220px);font-weight:800;letter-spacing:-.06em;line-height:.85;animation:telonK .9s cubic-bezier(.2,.8,.2,1) both .12s}
.telon[data-to="eval"] .telon-k{font-size:clamp(56px,11vw,150px);letter-spacing:-.05em;color:#FFCD00}
.telon[data-to="sst"] .telon-k{color:#F28A1E}

const PREGUNTAS = CONFIG.bloques.flatMap(b => b.preguntas);
const esRespuestas = claves => claves.includes('promedio') || PREGUNTAS.some(p => claves.includes(p.toLowerCase()));

function normRelaciones(objs){
  return objs.map(o => ({ jefe: limpio(pick(o, 'jefe', 'title', 'titulo')), sub: limpio(pick(o, 'subordinado', 'field1')), cargo: limpio(pick(o, 'cargo', 'field2')) }))
             .filter(r => r.jefe && r.sub);
}
function normRespuestas(objs){
  const out = []; let descartadas = 0;
  for (const o of objs){
    const jefe = limpio(pick(o, 'jefe')), sub = limpio(pick(o, 'subordinado'));
    if (!jefe || !sub){ descartadas++; continue; }
    const q = {}; for (const p of PREGUNTAS){ const v = num(o[p.toLowerCase()]); if (v != null) q[p] = v; }
    const f = parseFecha(pick(o, 'fecha')) || parseFecha(pick(o, 'created', 'creado'));
    let prom = num(o.promedio); if (prom == null) prom = mediaDe(Object.values(q));
    out.push({ jefe, sub, cargo: limpio(pick(o, 'cargo')), q, prom, ts: f ? f.ts : null, dia: f ? f.dia : null });
  }
  return { filas: out, descartadas };
}

let xlsxPromesa = null;
function cargarXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromesa) xlsxPromesa = new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX); s.onerror = () => mal(new Error('No pude cargar el lector de Excel. Exporta las listas como CSV.'));
    document.head.append(s);
  });
  return xlsxPromesa;
}
async function tablasDeArchivo(archivo){
  if (/\.xlsx?$/i.test(archivo.name)){
    const X = await cargarXLSX();
    const libro = X.read(await archivo.arrayBuffer(), { type: 'array' });
    return libro.SheetNames.map(n => X.utils.sheet_to_json(libro.Sheets[n], { header: 1, raw: true, defval: '' }));
  }
  return [parseCSV(await archivo.text())];
}

/* ==========================================================================
   Modelo: cruza Relaciones con Respuestas
   ========================================================================== */
function calcular(rel, res){
  const jefes = new Map(), pares = new Map(); let relRepetidas = 0;
  for (const r of rel){
    const kj = norm(r.jefe), ks = norm(r.sub); if (!kj || !ks) continue;
    const k = kj + '|' + ks;
    if (pares.has(k)){ relRepetidas++; continue; }
    let j = jefes.get(kj);
    if (!j){ j = { key: kj, nombre: bonito(r.jefe), nk: kj, items: [] }; jefes.set(kj, j); }
    const it = { jefe: j, sub: bonito(r.sub), ks, cargo: bonitoCargo(r.cargo), resp: null };
    pares.set(k, it); j.items.push(it);
  }
  const huerfanas = []; let repetidas = 0;
  for (const r of [...res].sort((a, b) => (a.ts ?? 0) - (b.ts ?? 0))){
    const it = pares.get(norm(r.jefe) + '|' + norm(r.sub));
    if (!it){ huerfanas.push(r); continue; }
    if (it.resp) repetidas++;
    it.resp = r;                                               // si hay repetidas, vale la última
  }
  const lista = [...jefes.values()];
  let total = 0, hechas = 0;
  for (const j of lista){
    j.total = j.items.length; j.hechas = j.items.filter(i => i.resp).length;
    j.estado = j.hechas === 0 ? 'sin' : (j.hechas === j.total ? 'ok' : 'curso');
    j.pend = j.total - j.hechas; j.pct = pctNum(j.hechas, j.total);
    total += j.total; hechas += j.hechas;
    j.items.sort((a, b) => (a.resp ? 1 : 0) - (b.resp ? 1 : 0) || a.sub.localeCompare(b.sub, 'es'));
  }
  const unicas = [...pares.values()].filter(i => i.resp).map(i => i.resp);
  const porEstado = { sin: 0, curso: 0, ok: 0 }; lista.forEach(j => porEstado[j.estado]++);
  const proms = unicas.map(r => r.prom).filter(v => v != null);
  const porPregunta = {}; let maxVisto = 0;
  for (const p of PREGUNTAS){
    const vs = unicas.map(r => r.q[p]).filter(v => v != null);
    porPregunta[p] = { media: mediaDe(vs), n: vs.length }; vs.forEach(v => { if (v > maxVisto) maxVisto = v; });
  }
  const bloques = CONFIG.bloques.map(b => {
    const vs = unicas.flatMap(r => b.preguntas.map(p => r.q[p]).filter(v => v != null));
    return { ...b, media: mediaDe(vs), n: vs.length };
  });
  const dias = new Map(); let ultimo = null;
  for (const r of unicas){ if (r.dia) dias.set(r.dia, (dias.get(r.dia) || 0) + 1); if (r.ts != null && (ultimo == null || r.ts > ultimo)) ultimo = r.ts; }
  const evaluadas = [...pares.values()].filter(i => i.resp);
  return { evaluadas, jefes: lista, total, hechas, porEstado, promedio: mediaDe(proms), nProm: proms.length, porPregunta, bloques,
           escala: Math.max(CONFIG.escalaMax, Math.ceil(maxVisto)), dias, ultimo, huerfanas, repetidas, relRepetidas };
}

function recalcular(){
  if (!S.rel){ S.datos = null; return; }
  S.datos = calcular(S.rel, S.res || []);
  S.cargadoEn = new Date(); S.animar = true;
}
function aplicarTablas(tablas){
  let rel = null, res = null;
  for (const filas of tablas){
    const objs = filasAObjetos(filas); if (!objs) continue;
    const cab = filas.find(f => { const k = f.map(claveCol); return k.includes('jefe') && k.includes('subordinado'); }).map(claveCol);
    if (esRespuestas(cab)){ const r = normRespuestas(objs); res = (res || []).concat(r.filas); S.descartadas = r.descartadas; }
    else rel = (rel || []).concat(normRelaciones(objs));
  }

}
async function cargarArchivos(archivos){
  const msg = $('.aviso-c', ctxCargador());
  try{
    const todas = []; for (const a of archivos) todas.push(...await tablasDeArchivo(a));
    const { rel, res } = aplicarTablas(todas);
    if (!rel && !res && !S.rel) throw new Error('No encontré las columnas Jefe y Subordinado. ¿Subiste las listas Relaciones y Respuestas?');
    if (rel) S.rel = rel;
    if (res) S.res = res;
    if (!S.rel) throw new Error('Falta la lista Relaciones (jefe, subordinado, cargo). Súbela junto con Respuestas.');
    if (rel && !res) S.res = S.res || [];
    S.ejemplo = false; recalcular(); cerrarDialogo(); pintar();

  } catch (e){
    if (msg){ msg.textContent = e.message; msg.classList.add('err'); } else aviso(e.message);
  }
}
function cargarDesdeSP(relItems, resItems){
  S.rel = normRelaciones(objetosSP(relItems));
  const r = normRespuestas(objetosSP(resItems)); S.res = r.filas; S.descartadas = r.descartadas;
  S.ejemplo = false; recalcular(); cerrarDialogo(); pintar();

  aviso(`Desde SharePoint: ${nf0.format(S.rel.length)} relaciones y ${nf0.format(S.res.length)} respuestas.`);
}

/* ==========================================================================
   Datos de ejemplo (ficticios) para ver cómo se ve el tablero
   ========================================================================== */
function datosEjemplo(){
  let semilla = 20261109;
  const rnd = () => { semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const el = a => a[Math.floor(rnd() * a.length)];
  const nombres = ['MARCELA','JORGE','LUCIA','ANDRES','PAOLA','CARLOS','DIANA','SERGIO','CLAUDIA','FELIPE','NATALIA','RICARDO','MONICA','IVAN','TATIANA','HERNAN','ALEJANDRA','OSCAR','VIVIANA','MAURICIO','KAREN','DANIEL','LILIANA','EDGAR','ROSA','NELSON','ANGELA','FABIAN','MARITZA','JAIME'];
  const apellidos = ['ROMERO','CASTRO','OSPINO','BLANCO','MENDOZA','VARGAS','PACHECO','SIERRA','NAVARRO','ORTEGA','PALACIO','GUERRERO','BARRIOS','MOLINA','CORREA','ARIAS','TORRES','CABRERA','LOPEZ','DE LA HOZ','POLO','MEJIA','BERDUGO','CHARRIS','OROZCO','VISBAL','ACOSTA','REYES','SALCEDO','PEREZ'];
  const cargos = ['SECRETARIA/O','SECRETARIA/O','AUXILIAR ADMINISTRATIVO','AUXILIAR DE LABORATORIO','AUXILIAR DE BIBLIOTECA','AUXILIAR DE ADQUISICIONES'];
  const usados = new Set(); const nuevo = f => { let n; do { n = f(); } while (usados.has(n)); usados.add(n); return n; };
  const tamanos = [...Array(18).fill(1), ...Array(8).fill(2), 3, 3, 3, 4, 4, 5, 5, 6, 7, 9, 12, 16, 22];
  const rel = [], res = []; const hoy = hoyBogota();
  const ahora = { h: +new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.zona, hour: '2-digit', hourCycle: 'h23' }).format(new Date()) };
  tamanos.forEach(n => {
    const jefe = nuevo(() => `${el(nombres)} ${el(apellidos)} ${el(apellidos)}`);
    const perfil = rnd(); const frac = perfil < .3 ? 0 : perfil < .7 ? .2 + rnd() * .6 : 1;
    for (let i = 0; i < n; i++){
      const sub = nuevo(() => `${el(apellidos)} ${el(apellidos)} ${el(nombres)} ${el(nombres)}`); const cargo = el(cargos);
      rel.push({ jefe, sub, cargo });
      if (rnd() < frac){
        const q = {}; PREGUNTAS.forEach(p => { q[p] = rnd() < .08 ? 3 : rnd() < .5 ? 4 : 5; });
        const vals = Object.values(q); const dia = sumaDias(hoy, -Math.floor(rnd() * rnd() * 12));
        const tope = dia === hoy ? Math.max(8, ahora.h - 1) : 17;
        const hh = String(8 + Math.floor(rnd() * (tope - 8 + 1))).padStart(2, '0'), mm = String(Math.floor(rnd() * 60)).padStart(2, '0');
        const f = parseFecha(`${dia} ${hh}:${mm}:00`);
        res.push({ jefe, sub, cargo, q, prom: mediaDe(vals), ts: f.ts, dia });
      }
    }
  });
  const fp = parseFecha(`${hoy} ${String(Math.max(8, ahora.h - 1)).padStart(2, '0')}:05:00`);
  res.push({ jefe: 'PRUEBA MIGRACION (BORRAR)', sub: 'PRUEBA SUBORDINADO', cargo: 'SECRETARIA/O', q: { G1: 4 }, prom: 4, ts: fp.ts, dia: hoy });
  if (res.length > 3) res.push({ ...res[1], ts: res[1].ts + 3600e3 });
  return { rel, res };
}

function dibujarMosaico(cont, D){
  const W = Math.max(240, cont.clientWidth || 600); cont._w = cont.clientWidth;
  const jefes = [...D.jefes].sort((a, b) => b.total - a.total || a.nombre.localeCompare(b.nombre, 'es'));
  const objetivo = W * (W < 520 ? 300 : 260);
  let c = 6;
  for (let t = 18; t >= 6; t--){ const g = t >= 12 ? 3 : 2; if (D.total * (t + g) * (t + g) * 1.55 <= objetivo){ c = t; break; } }
  const g = c >= 12 ? 3 : 2;
  cont.style.setProperty('--gb', (c >= 12 ? 10 : 7) + 'px'); cont.style.setProperty('--c', c + 'px'); cont.style.setProperty('--g', g + 'px');
  const paso = Math.min(1, 160 / Math.max(1, jefes.length));
  const frag = document.createDocumentFragment();
  jefes.forEach((j, bi) => {
    const cols = Math.max(1, Math.ceil(Math.sqrt(j.total)));
    const eq = h('div', { class: 'eq', style: `--cols:${cols}`, 'data-key': j.key });
    for (let i = 0; i < j.total; i++) eq.append(h('i', { class: i < j.hechas ? 'h' : null, style: `--k:${(bi * paso + i * .35).toFixed(2)}` }));
    tip(eq, () => [j.nombre, `${j.hechas} de ${j.total} respondidos · ${ETIQ[j.estado]}`]);
    eq.addEventListener('click', () => verResumenJefe(j));
    frag.append(eq);
  });
  cont.replaceChildren(frag);
  cont.classList.toggle('anima', !!S.animar); S.animar = false;
}

// Basta con algunas palabras del nombre, en cualquier orden: "maria garcia" encuentra a María Fernanda García López
function tokensBusqueda(q){
  const t = norm(q).split(/[\s-]+/).filter(Boolean);
  const sinParticulas = t.filter(w => !PARTICULAS.has(w.toLowerCase()));
  return sinParticulas.length ? sinParticulas : t;
}
function coincideNombre(nombre, tokens){
  if (!tokens.length) return true;
  const palabras = nombre.split(/[\s-]+/);
  return tokens.every(t => palabras.some(p => p.startsWith(t)));
}
function filtrarSub(D){
  const q = tokensBusqueda(S.q);
  return D.jefes.flatMap(j => j.items).filter(i => {
    if (S.filtroSub === 'pend' && i.resp) return false;
    if (S.filtroSub === 'eval' && !i.resp) return false;
    return coincideNombre(i.ks, q);
  }).sort((a, b) => a.sub.localeCompare(b.sub, 'es') || a.jefe.nombre.localeCompare(b.jefe.nombre, 'es'));
}
function sincronizarBusqueda(){
  const sub = S.por === 'sub';
  document.querySelectorAll('[data-por]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.por === S.por)));
  const q = $('#q'); if (q) q.placeholder = sub ? 'Escribe nombre y apellido del técnico o auxiliar' : 'Escribe nombre y apellido del líder';
  const o = $('#orden'); if (o) o.hidden = sub;
}

  if (hecho){

  return li;

function filtrar(D){
  const q = tokensBusqueda(S.q);
  let l = D.jefes.filter(j => {
    if (S.filtro === 'faltan' && j.estado === 'ok') return false;
    if (S.filtro === 'sin' && j.estado !== 'sin') return false;
    if (S.filtro === 'curso' && j.estado !== 'curso') return false;
    if (S.filtro === 'ok' && j.estado !== 'ok') return false;
    return coincideNombre(j.nk, q);
  });
  const cmp = {
    pendientes: (a, b) => b.pend - a.pend || a.nombre.localeCompare(b.nombre, 'es'),
    menor: (a, b) => a.pct - b.pct || b.pend - a.pend || a.nombre.localeCompare(b.nombre, 'es'),
    mayor: (a, b) => b.pct - a.pct || a.nombre.localeCompare(b.nombre, 'es'),
    nombre: (a, b) => a.nombre.localeCompare(b.nombre, 'es')
  }[S.orden];
  return l.sort(cmp);
}

    const subs = h('div', { class: 'subs' });
    const pen = j.items.filter(i => !i.resp), hec = j.items.filter(i => i.resp);
    const fila = (i, hecho) => {

        h('span', {}, h('b', { text: i.sub }), h('span', { class: 'cargo', text: i.cargo })),

        li.addEventListener('click', () => verRespuesta(i));
        li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); verRespuesta(i); } });
      }

function csvCampo(v){ const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function descargarCSV(){
  if (S.por === 'sub'){
    const l = filtrarSub(S.datos);
    const f = [['Técnico o auxiliar', 'Cargo', 'Líder de departamento', 'Estado', 'Promedio']];
    l.forEach(i => f.push([i.sub, i.cargo, i.jefe.nombre, i.resp ? 'Evaluado' : 'Pendiente', i.resp && i.resp.prom != null ? nf2.format(i.resp.prom) : '']));
    const b = new Blob(['\uFEFF' + f.map(x => x.map(csvCampo).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(b), download: `tecnicos-auxiliares-${S.filtroSub}-${hoyBogota()}.csv` });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    aviso(`CSV con ${l.length} personas descargado.`); return;
  }
  const lista = filtrar(S.datos);
  const filas = [['Líder de departamento', 'Estado', 'Respondidas', 'Total', 'Porcentaje', 'Falta por evaluar']];
  lista.forEach(j => filas.push([j.nombre, ETIQ[j.estado], j.hechas, j.total, pctTexto(j.hechas, j.total) + '%', j.items.filter(i => !i.resp).map(i => i.sub).join(' / ')]));
  const blob = new Blob(['﻿' + filas.map(f => f.map(csvCampo).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `lideres-${S.filtro}-${hoyBogota()}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  aviso(`CSV con ${lista.length} líderes descargado.`);
}

  const hoy = hoyBogota(); let fin = dias[dias.length - 1] > hoy ? dias[dias.length - 1] : hoy;
  let ini = dias[0]; if (diasEntre(ini, fin) > 30) ini = sumaDias(fin, -30);
  const serie = []; for (let d = ini; d <= fin; d = sumaDias(d, 1)) serie.push({ dia: d, n: D.dias.get(d) || 0 });
  const nombreDia = d => fmtDia.format(new Date(Date.parse(d + 'T00:00:00Z')));
  if (S.tablaDias){
    const t = h('table', { class: 'tab-datos' }, h('thead', {}, h('tr', {}, h('th', { text: 'Día' }), h('th', { text: 'Cuestionarios' }))));
    const tb = h('tbody', {}); [...serie].reverse().forEach(s => tb.append(h('tr', {}, h('td', { text: nombreDia(s.dia) }), h('td', { text: nf0.format(s.n) })))); t.append(tb); cont.append(t);
  } else {
    cont.dataset.serie = JSON.stringify(serie);
    queueMicrotask(() => dibujarDias(cont, serie, nombreDia));
  }
  return h('section', { class: 'g-bloque' }, cab, cont);
}

const nombreDiaGlobal = d => fmtDia.format(new Date(Date.parse(d + 'T00:00:00Z')));
function dibujarDias(cont, serie, nombreDia){
  const W = Math.max(260, cont.clientWidth || 360); cont._w = cont.clientWidth;
  const H = 170, izq = 30, der = 4, arr = 22, aba = 26;
  const pw = W - izq - der, ph = H - arr - aba;
  const maxN = Math.max(1, ...serie.map(s => s.n));
  const paso = maxN <= 5 ? 1 : maxN <= 10 ? 2 : maxN <= 30 ? 5 : maxN <= 60 ? 10 : maxN <= 150 ? 25 : 50;
  const tope = Math.max(paso, Math.ceil(maxN / paso) * paso);
  const y = v => arr + ph - v / tope * ph;
  const slot = pw / serie.length, bw = Math.min(24, slot * 0.62);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H + 12}`, role: 'img', 'aria-label': 'Cuestionarios respondidos por día' });
  const ticks = tope % 2 === 0 && tope > 2 ? [0, tope / 2, tope] : [0, tope];
  ticks.forEach(v => svg.append(
    sv('line', { x1: izq, x2: W - der, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }),
    sv('text', { x: izq - 8, y: y(v) + 4, 'text-anchor': 'end' }, document.createTextNode(String(v)))));
  const cadaN = Math.max(1, Math.ceil(26 / slot));
  const maxI = serie.reduce((m, s, i) => s.n > serie[m].n ? i : m, 0);
  serie.forEach((s, i) => {
    const cx = izq + slot * (i + .5), x = cx - bw / 2, ytop = y(s.n), alto = arr + ph - ytop;
    svg.append(sv('rect', { class: 'hit', x: izq + slot * i, y: arr - 6, width: slot, height: ph + 6 + aba - 4, tabindex: '0', 'aria-label': `${nombreDia(s.dia)}: ${s.n} cuestionarios` }));
    const hit = svg.lastChild; tip(hit, () => [`${nf0.format(s.n)} cuestionarios`, nombreDia(s.dia)]);
    if (s.n > 0){
      const r = Math.min(4, alto, bw / 2);
      svg.append(sv('path', { class: 'col-d', fill: 'var(--barra)', d: `M${x},${arr + ph} V${ytop + r} Q${x},${ytop} ${x + r},${ytop} H${x + bw - r} Q${x + bw},${ytop} ${x + bw},${ytop + r} V${arr + ph} Z` }));
    } else svg.append(sv('g', { class: 'col-d' }));
    if (i % cadaN === 0 || i === serie.length - 1){
      const d = new Date(Date.parse(s.dia + 'T00:00:00Z'));
      svg.append(sv('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, document.createTextNode(String(d.getUTCDate()))));
      if (i === 0 || d.getUTCDate() === 1)
        svg.append(sv('text', { x: cx, y: H + 6, 'text-anchor': i === 0 ? 'start' : 'middle', style: 'font-weight:600' }, document.createTextNode(fmtMes.format(d).replace('.', ''))));
    }
    if (s.n > 0 && (i === maxI || i === serie.length - 1 || serie.length <= 8))
      svg.append(sv('text', { class: 'v', x: cx, y: ytop - 5, 'text-anchor': 'middle' }, document.createTextNode(String(s.n))));
  });
  cont.replaceChildren(svg);
  cont.dataset.serie = JSON.stringify(serie);
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => {
  const c = $('.dias[data-serie]'); if (c && c.clientWidth !== c._w) dibujarDias(c, JSON.parse(c.dataset.serie), nombreDiaGlobal);

function contar(nodo, fin, fmt){
  if (!nodo || !fin || reduceMov() || document.hidden) return;
  const final = nodo.nodeValue, t0 = performance.now(), dur = 1000; let listo = false;
  const paso = t => {
    if (listo) return;
    const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
    if (k < 1){ nodo.nodeValue = fmt(fin * e); requestAnimationFrame(paso); } else { listo = true; nodo.nodeValue = final; }
  };
  requestAnimationFrame(paso);
  setTimeout(() => { listo = true; nodo.nodeValue = final; }, dur + 300);
}

function dibujarLinea(cont, valores, escala, animar){
  cont._dibujar = () => dibujarLinea(cont, valores, escala, false);
  const W = Math.max(280, cont.clientWidth || 640); cont._w = cont.clientWidth;
  const estrecho = W < 520, H = estrecho ? 300 : 350, izq = estrecho ? 44 : 56, der = 12, arr = 28, aba = estrecho ? 78 : 72;
  const pw = W - izq - der, ph = H - arr - aba, n = PREGUNTAS.length, base = .5;
  const x = i => izq + pw * (i + .5) / n, y = v => arr + ph * (1 - (v - base) / (escala - base));
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', class: animar ? 'anima' : null,
    'aria-label': 'Calificación por pregunta. ' + PREGUNTAS.map(p => `${p}: ${fmtCalif(valores[p])}`).join(', ') });

  svg.append(sv('line', { x1: izq, x2: izq, y1: arr - 8, y2: arr + ph, stroke: 'var(--fg)', 'stroke-width': 1 }),
    sv('line', { x1: izq, x2: W - der, y1: arr + ph, y2: arr + ph, stroke: 'var(--fg)', 'stroke-width': 1 }),
    texto('Calificación', { class: 'tit', transform: `translate(14 ${arr + ph / 2}) rotate(-90)`, 'text-anchor': 'middle' }),
    texto('Pregunta', { class: 'tit', x: izq + pw / 2, y: H - 6, 'text-anchor': 'middle' }));
  // Bloques bajo el eje

    const fin = ini + b.preguntas.length - 1, y0 = arr + ph + (estrecho ? 40 : 32);

  if (tramo.length) tramos.push(tramo);

function aWin(s){
  const o = [];

    const c = ch.codePointAt(0);
    if (c < 32) o.push(32); else if (c < 127 || (c >= 160 && c <= 255)) o.push(c); else o.push(WIN_EXTRA[c] || 63);
  }

}
const anchoPDF = (s, t, neg) => aWin(s).reduce((a, c) => a + PDF_ANCHOS[neg ? 'b' : 'r'][c], 0) * t / 1000;
function partirPDF(s, t, w, neg){
  const out = []; let l = '';
  for (const p of String(s).split(' ')){
    const c = l ? l + ' ' + p : p;
    if (l && anchoPDF(c, t, neg) > w){ out.push(l); l = p; } else l = c;

  const circulo = (cx, cyy, ra, relleno, trazo) => {

    if (px + r.width > innerWidth - 8) px = x - r.width - 14; if (py + r.height > innerHeight - 8) py = y - r.height - 12;
    TIP.style.left = Math.max(8, px) + 'px'; TIP.style.top = Math.max(8, py) + 'px';
  };
  el.addEventListener('pointermove', e => mostrar(e.clientX, e.clientY));
  el.addEventListener('pointerleave', () => TIP.classList.remove('on'));
  el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); mostrar(r.left + r.width / 2, r.top); });

}

function tip(el, texto){
  const mostrar = (x, y) => { const t = TIP(); t.textContent = typeof texto === 'function' ? texto() : texto; t.classList.add('on'); const r = t.getBoundingClientRect(); t.style.left = Math.min(innerWidth - r.width - 8, Math.max(8, x - r.width / 2)) + 'px'; t.style.top = Math.max(8, y - r.height - 12) + 'px'; };
  el.addEventListener('pointermove', e => mostrar(e.clientX, e.clientY));
  el.addEventListener('pointerleave', () => TIP().classList.remove('on'));
  el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); mostrar(r.left + r.width / 2, r.top); });
  el.addEventListener('blur', () => TIP().classList.remove('on'));
}
async function copiar(txt, msg){
  try{ await navigator.clipboard.writeText(txt); aviso(msg); }
  catch(_){ const a = h('textarea', { style: { position: 'fixed', opacity: '0' } }); a.value = txt; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); aviso(msg); }
}
function descargar(nombre, filas){
  const esc = v => { const s = v == null ? '' : String(v); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + filas.map(f => f.map(esc).join(';')).join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: nombre });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

let S = ST[cur];

function normPersona(o){
  const nombre = String(o.Title ?? o['Título'] ?? o.Titulo ?? o.Nombre ?? '').trim();
  return { nombre, key: clave(nombre), area: String(o.Area ?? o['Área'] ?? '').trim() || 'Sin área', cargo: String(o.Cargo ?? '').trim(), correo: String(o.Correo ?? '').trim(), familia: String(o.Familia ?? '').trim() };
}
function recalcularTodo(){ const c = cur; IDS.forEach(k => { if (ST[k].personasRaw){ cur = k; APP = APPS[k]; S = ST[k]; recalcular(); } }); cur = c; APP = APPS[c]; S = ST[c]; }
function recalcular(){
  const personas = S.personasRaw.map(normPersona).filter(p => p.nombre);
  const mapa = new Map(); personas.forEach(p => { p.resp = []; if (!mapa.has(p.key)) mapa.set(p.key, p); });
  const todas = S.respRaw.map(o => {
    const r = APP.normalizar(o, { lista, parseFecha });
    const f = parseFecha(o.Fecha) || parseFecha(o.Created);
    r.ts = f ? f.ts : 0; r.dia = f ? f.dia : ''; r.nombre = String(o.Nombre || '').trim(); r.key = clave(r.nombre);
    r.area = String(o.Area || '').trim(); r.cargo = String(o.Cargo || '').trim(); r.raw = o;
    return r;
  }).filter(r => r.nombre).sort((a, b) => b.ts - a.ts);
  const fuera = [];
  todas.forEach(r => { const p = mapa.get(r.key); if (p) p.resp.push(r); else fuera.push(r); });
  const ultimaPor = new Map(); todas.forEach(r => { if (!ultimaPor.has(r.key)) ultimaPor.set(r.key, r); });
  const usadas = S.modo === 'ultima' ? [...ultimaPor.values()] : todas;
  const respondieron = personas.filter(p => p.resp.length).length;
  const hoy = hoyBogota();
  S.D = { personas, todas, usadas, fuera, respondieron, total: personas.length, n: usadas.length,
    hoy: todas.filter(r => r.dia === hoy).length, ultima: todas[0] || null,
    repetidas: [...ultimaPor.keys()].filter(k => todas.filter(r => r.key === k).length > 1).length };
}

    h('button', { class: 'btn line', type: 'button', html: ICON.copiar + 'Copiar correos de pendientes', onclick: () => { const c = pend().map(p => p.correo).filter(Boolean); c.length ? copiar(c.join('; '), `${c.length} correos copiados.`) : aviso('No hay pendientes con correo.'); } }),
    h('button', { class: 'btn line', type: 'button', html: ICON.copiar + 'Copiar nombres de pendientes', onclick: () => { const c = pend().map(p => p.nombre); c.length ? copiar(c.join('\n'), `${c.length} nombres copiados.`) : aviso('No hay pendientes.'); } }),
    h('button', { class: 'btn prim', type: 'button', html: ICON.bajar + 'Descargar respuestas (CSV)', onclick: () => {
      const cols = [['Fecha', r => r.raw.Fecha], ['Nombre', r => r.nombre], ['Área', r => r.area], ['Cargo', r => r.cargo], ...APP.csv];
      descargar(`${APP.corto}-respuestas-${hoyBogota()}.csv`, [cols.map(c => c[0]), ...D.todas.map(r => cols.map(c => c[1](r)))]);
      aviso(`Descargadas ${D.todas.length} respuestas.`);
    } }));
  pintarLista(false);
  return [h('div', { class: 'sec-cab' }, h('div', {}, h('h2', { text: 'Quién respondió y quién falta' }), h('p', { text: 'Toca a alguien que ya respondió para ver su cuestionario completo. Los correos de los pendientes sirven para el recordatorio.' }))), herr, acciones, cont];
}
function revision(){
  const D = S.D; const items = [];
  if (D.fuera.length) items.push(h('li', { text: `${D.fuera.length} ${D.fuera.length === 1 ? 'respuesta viene' : 'respuestas vienen'} de nombres que no están en ${APP.listas.personas}: ${[...new Set(D.fuera.map(r => r.nombre))].join(', ')}. Sí cuentan en las gráficas, no en el avance.` }));
  if (D.repetidas) items.push(h('li', { text: `${D.repetidas} ${D.repetidas === 1 ? 'persona envió' : 'personas enviaron'} el cuestionario más de una vez. Con "La más reciente por persona" solo cuenta su último envío.` }));
  const pr = D.todas.filter(r => /prueba/i.test(Object.values(r.raw).join(' ')));
  if (pr.length) items.push(h('li', { text: `${pr.length} ${pr.length === 1 ? 'respuesta tiene' : 'respuestas tienen'} la palabra "prueba": ${pr.map(r => r.nombre + ' (' + fechaTxt(r.ts) + ')').join(', ')}. Si fue un ensayo, bórrala de la lista.` }));
  if (!items.length) return null;
  return h('details', { class: 'revision' }, h('summary', { text: `Revisión de datos (${items.length})` }), h('ul', {}, items));
}

/* ---------- Detalle ---------- */
function abrirPersona(p){
  if (!p.resp.length){ aviso(`${p.nombre} todavía no ha respondido.`); return; }
  abrirRespuesta(p.resp[0], p.resp);
}
function abrirRespuesta(r, versiones){
  versiones = (versiones || S.D.todas.filter(x => x.key === r.key)).slice().sort((a, b) => a.ts - b.ts);
  const dlg = $('#dlg');
  const cuerpo = h('div', { class: 'dlg-cuerpo' });
  const total = versiones.length;
  const campos = rr => APP.detalle(rr, U).filter(([t, c]) => !(c == null || c === '' || (Array.isArray(c) && !c.length)))
    .map(([t, c]) => h('div', { class: 'campo' }, h('h4', { text: t }), typeof c === 'string' ? h('p', { text: c }) : c));
  const ord = i => `${i + 1}.ª`;
  const pintarR = sel => {
    cuerpo.replaceChildren();
    if (total > 1){
      cuerpo.append(h('div', { class: 'veces' },
        h('p', { class: 'veces-t', html: `Respondió el cuestionario <b>${total} veces</b>. Toque una para verla sola o vea todas en orden.` }),
        h('div', { class: 'versiones' },
          h('button', { type: 'button', 'aria-pressed': String(sel === 'todas'), text: 'Todas', onclick: () => pintarR('todas') }),
          versiones.map((v, i) => h('button', { type: 'button', 'aria-pressed': String(v === sel), onclick: () => pintarR(v) }, h('b', { text: ord(i) }), ' · ' + fechaTxt(v.ts))))));
    }
    if (sel === 'todas') versiones.slice().reverse().forEach(v => { const i = versiones.indexOf(v);
      cuerpo.append(h('section', { class: 'envio' }, h('h3', { class: 'envio-t' }, h('span', { class: 'envio-n', text: String(i + 1) }), `${ord(i)} respuesta`, h('small', { text: (i === total - 1 ? 'la más reciente · ' : '') + fechaTxt(v.ts) })), campos(v))); });
    else cuerpo.append(...campos(sel));
    const ref = sel === 'todas' ? versiones[total - 1] : sel;
    $('#dlgSub').textContent = [ref.cargo, ref.area, total > 1 ? `${total} respuestas, la última el ${fDia.format(new Date(versiones[total - 1].ts))}` : 'Respondió el ' + (ref.ts ? fDia.format(new Date(ref.ts)) : 'sin fecha')].filter(Boolean).join(' · ');
    const dc = dlg.querySelector('#dlgCuerpo'); if (dc && dc === cuerpo) dlg.scrollTop = 0;
  };
  $('#dlgTit').textContent = r.nombre;
  pintarR(total > 1 ? 'todas' : r);
  $('#dlgCuerpo').replaceWith(Object.assign(cuerpo, { id: 'dlgCuerpo' }));
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

/* ---------- Carga ---------- */
function bienvenida(){
  const fav = h('a', { class: 'fav', href: window.codigoFavoritoTablero ? window.codigoFavoritoTablero() : '#', html: ICON.estrella + 'Cargar al tablero', onclick: e => { e.preventDefault(); aviso('Arrastra este botón a la barra de favoritos. Desde aquí no hace nada.'); } });
  return h('div', { class: 'wrap bienv' },
    h('div', {},
      h('h2', { text: 'Resultados de los sondeos SST y ELT 2027' }),
      h('p', { text: `El favorito lee las listas de los sondeos (${IDS.map(k => APPS[k].listas.personas + ', ' + APPS[k].listas.respuestas).join(', ')}) desde la cuenta de capacitación. Todo se calcula en este navegador y no se guarda nada: al cerrar la pestaña, los datos desaparecen.` }),
      h('ol', { class: 'pasos' },
        h('li', {}, h('span', {}, 'Arrastra este botón a la barra de favoritos. Es el mismo de la evaluación de desempeño: si ya lo tenías de antes, reemplázalo por este, que también trae SST y ELT. ', fav)),
        h('li', { text: 'Abre cualquier lista de "Mis listas" de capacitacion@uninorte.edu.co, por ejemplo SST_Respuestas.' }),
        h('li', { text: 'Pulsa el favorito. Se abre este tablero con la evaluación, SST y ELT al día.' }))),
    zonaArchivos());
}
function zonaArchivos(){
  const msg = h('p', { class: 'msg', text: '' });
  const input = h('input', { type: 'file', accept: '.csv', multiple: true, hidden: true, onchange: e => leerArchivos([...e.target.files], msg) });
  const z = h('div', { class: 'soltar' },
    h('strong', { text: 'O sube las dos listas exportadas' }),
    h('p', { text: 'En cada lista: Exportar → Exportar a CSV. Suelta aquí los archivos de un sondeo o de los dos a la vez; el nombre del archivo debe empezar por SST_ o ELT_.' }),
    h('div', { class: 'fila-btn' },
      h('button', { class: 'btn prim', type: 'button', text: 'Elegir archivos', onclick: () => input.click() }),
      h('button', { class: 'btn line', type: 'button', text: 'Ver datos de ejemplo', onclick: () => { IDS.forEach(k => { const e = APPS[k].ejemplo(); Object.assign(ST[k], { personasRaw: e.personas, respRaw: e.respuestas, animar: true }); recalcularTodo(); }); G.ejemplo = true; if ($('#dlgCarga').open) $('#dlgCarga').close(); pintar(); scrollTo(0, 0); } })),
    input, msg);
  ['dragenter', 'dragover'].forEach(t => z.addEventListener(t, e => { e.preventDefault(); z.classList.add('sobre'); }));
  ['dragleave', 'drop'].forEach(t => z.addEventListener(t, e => { e.preventDefault(); z.classList.remove('sobre'); }));
  z.addEventListener('drop', e => leerArchivos([...e.dataTransfer.files], msg));
  return z;
}
function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  const prim = txt.split(/\r?\n/)[0]; const sep = (prim.match(/;/g) || []).length > (prim.match(/,/g) || []).length ? ';' : ',';
  const filas = []; let f = [], c = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i + 1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; continue; }
    if (ch === '"') q = true; else if (ch === sep){ f.push(c); c = ''; } else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i + 1] === '\n') i++; f.push(c); filas.push(f); f = []; c = ''; } else c += ch;
  }
  if (c || f.length){ f.push(c); filas.push(f); }
  const cab = filas.shift().map(x => x.trim());
  return filas.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(cab.map((k, i) => [k === 'Título' || k === 'Title' ? 'Title' : k, r[i] ?? ''])));
}
async function leerArchivos(files, msg){
  try{
    const leidos = await Promise.all(files.filter(f => /\.csv$/i.test(f.name)).map(async f => ({ nombre: f.name, filas: parseCSV(await f.text()) })));
    const cargados = [];
    IDS.forEach(k => {
      const L = APPS[k].listas;
      const de = n => leidos.find(x => x.nombre.toLowerCase().startsWith(n.toLowerCase()));
      const per = de(L.personas), res = de(L.respuestas);
      if (per && res){ Object.assign(ST[k], { personasRaw: per.filas, respRaw: res.filas, animar: true }); cargados.push(APPS[k].corto); }
    });
    if (!cargados.length) throw new Error('No encontré un par completo. Sube, por ejemplo, SST_Personas.csv y SST_Respuestas.csv juntos (el nombre del archivo debe empezar así).');
    G.ejemplo = false; recalcularTodo(); if ($('#dlgCarga').open) $('#dlgCarga').close();
    if (!S.D && window.SECCION) window.SECCION.ir(IDS.find(k => ST[k].D), null); else { pintar(); scrollTo(0, 0); }
    aviso(`Cargado: ${cargados.join(' y ')}.`);
  }catch(e){ msg.textContent = e.message; msg.classList.add('err'); }
}
function abrirCarga(){ const d = $('#dlgCarga'); const c = $('#dlgCargaCuerpo'); c.replaceChildren(bienvenida()); d.showModal(); }

/* ---------- Entrada de datos desde el favorito de la evaluación ---------- */
function cargarListas(listas){
  if (!listas || typeof listas !== 'object') return [];
  const cargados = [];
  IDS.forEach(k => { const L = APPS[k].listas, p = listas[L.personas], r = listas[L.respuestas];
    if (Array.isArray(p) && Array.isArray(r)){ Object.assign(ST[k], { personasRaw: p, respRaw: r, animar: true }); cargados.push(`${APPS[k].corto}: ${r.length} respuestas`); } });
  if (cargados.length){ G.ejemplo = false; recalcularTodo(); if ($('#dlgCarga').open) $('#dlgCarga').close(); pintar(); }
  return cargados;
}

/* ---------- Cambio de sección (SST / ELT) con transición ---------- */
function sinDatos(){
  return h('div', { class: 'wrap bienv' }, h('div', {}, h('h2', { text: `Todavía no hay datos de ${APP.corto}` }),
    h('p', { text: `Carga ${APP.listas.personas} y ${APP.listas.respuestas} con el favorito o con “Actualizar datos”.` }),
    h('button', { class: 'btn prim', type: 'button', text: 'Actualizar datos', onclick: abrirCarga })));
}
function mostrar(id){
  if (!IDS.includes(id)) return;
  cur = id; APP = APPS[id]; S = ST[id]; S.animar = true; pintar();
}
ROOT.querySelectorAll('.selector button').forEach(b => b.addEventListener('click', () => window.SECCION && window.SECCION.ir(b.dataset.id, b)));
window.SONDEOS = { mostrar, cargar: cargarListas, ids: IDS, apps: APPS, actual: () => cur };

/* ---------- Tema y arranque ---------- */
function espejoTema(){ const t = document.documentElement.getAttribute('data-theme'); if (t) RAIZ.setAttribute('data-theme', t); else RAIZ.removeAttribute('data-theme'); }
new MutationObserver(espejoTema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); espejoTema();
$('#btnTema').innerHTML = ICON.luna;
$('#btnTema').addEventListener('click', () => {
  const actual = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  const nuevo = actual === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nuevo); try{ localStorage.setItem('tema', nuevo); }catch(_){}
});
$('#btnActualizar').innerHTML = ICON.rec + '<span>Actualizar datos</span>';
$('#btnActualizar').addEventListener('click', abrirCarga);
$('#dlgCerrar').innerHTML = ICON.x; $('#dlgCerrar').addEventListener('click', () => $('#dlg').close());
$('#dlgCargaCerrar').innerHTML = ICON.x; $('#dlgCargaCerrar').addEventListener('click', () => $('#dlgCarga').close());
['#dlg', '#dlgCarga'].forEach(s => $(s).addEventListener('click', e => { if (e.target === $(s)) $(s).close(); }));
pintar();
})();

</script>
<script>
/* ===== Secciones: Evaluación / SST / ELT, con telón animado al cambiar ===== */
(function(){
'use strict';
const IDS = ['eval', 'sst', 'elt'];
const host = document.getElementById('sondeosHost'), pag = document.getElementById('evalPagina');
const TELON = { eval: ['Evaluación', 'Evaluación de desempeño'], sst: ['SST', 'Sondeo de formación en SST 2027'], elt: ['ELT', 'Escuela de Liderazgo Transformador 2027'] };
const TITULO_EVAL = document.title;
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let actual = null, ocupado = false;
function aplicar(id){
  actual = id;
  pag.hidden = id !== 'eval'; host.hidden = id === 'eval';
  document.documentElement.dataset.seccion = id;
  if (id === 'eval') document.title = TITULO_EVAL; else window.SONDEOS.mostrar(id);
  document.querySelectorAll('#selEval button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  try{
    localStorage.setItem('seccion', id);
    if (location.hash !== '#sp') history.replaceState(null, '', location.pathname + '#' + (id === 'eval' ? 'evaluacion' : id));
  }catch(_){}
  scrollTo(0, 0);
}
function ir(id, origen){
  if (!IDS.includes(id) || ocupado || id === actual) return;
  if (reduce() || !Element.prototype.animate){ aplicar(id); return; }
  ocupado = true;
  const r = origen ? origen.getBoundingClientRect() : { left: innerWidth / 2, top: 80, width: 0, height: 0 };
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 20;
  const capa = document.createElement('div'); capa.className = 'telon'; capa.dataset.to = id;
  capa.innerHTML = '<div class="telon-pat" aria-hidden="true">' + '<i></i>'.repeat(Math.ceil((innerHeight + 40) / 104) + 1) + '</div><div class="telon-in"><span class="telon-k"></span><span class="telon-t"></span></div>';
  capa.querySelector('.telon-k').textContent = TELON[id][0]; capa.querySelector('.telon-t').textContent = TELON[id][1];
  capa.style.clipPath = `circle(0px at ${x}px ${y}px)`;
  document.body.append(capa);
  capa.animate([{ clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(${rad}px at ${x}px ${y}px)` }], { duration: 620, easing: 'cubic-bezier(.7,0,.25,1)', fill: 'forwards' }).finished
    .then(() => { aplicar(id); return new Promise(res => setTimeout(res, 280)); })
    .then(() => capa.animate([{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 100% 0)' }], { duration: 560, easing: 'cubic-bezier(.7,0,.25,1)', fill: 'forwards' }).finished)
    .catch(() => {})
    .then(() => { capa.remove(); ocupado = false; });
}
window.SECCION = { ir, actual: () => actual };
document.querySelectorAll('#selEval button').forEach(b => b.addEventListener('click', () => ir(b.dataset.id, b)));
addEventListener('keydown', e => {
  if (!e.altKey || !/^[123]$/.test(e.key)) return;
  e.preventDefault();
  const id = IDS[+e.key - 1];
  const sel = id === 'eval' || actual === 'eval' ? document.querySelector(`#selEval [data-id="${id}"]`) : null;
  ir(id, sel);
});
let inicial = { evaluacion: 'eval', eval: 'eval', sst: 'sst', elt: 'elt' }[location.hash.slice(1)];
if (!inicial){ try{ inicial = localStorage.getItem('seccion'); }catch(_){} }
aplicar(IDS.includes(inicial) ? inicial : 'eval');

/* Pantalla de carga al entrar: corta pero visible */
const cg = document.getElementById('cargando');
if (cg){
  const filas = cg.querySelector('.cg-filas');
  filas.innerHTML = Array.from({ length: Math.ceil((innerHeight + 48) / 116) + 1 }, (_, k) => `<i style="--k:${k}"></i>`).join('');
  setTimeout(() => {
    cg.classList.add('sale');
    setTimeout(() => { cg.remove(); if (actual !== 'eval') window.SONDEOS.mostrar(actual); }, reduce() ? 0 : 760);
  }, reduce() ? 500 : 1950);
}
})();

</script>
